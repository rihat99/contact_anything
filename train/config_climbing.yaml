# --------------------------------------------------------------------------
# Experiment 1 — contact head on ClimbingImages_v1 only.
# Same model / loss / optim as the DAMON baseline (train/config.yaml); only
# the data source and exp_name differ. Random train/val split, fixed seed.
# --------------------------------------------------------------------------

model:
  # SAM-3D-Body base (DINOv3-H + frozen decoder).
  checkpoint_path: /data3/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/model.ckpt
  mhr_model_path:  /data3/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/assets/mhr_model.pt

  contact_head:
    num_keypoint_tokens: 21
    num_global_tokens:   3
    num_vertices:        6890       # SMPL — matches climbing GT directly
    mlp_depth:           4
    mlp_channel_div_factor: 2
    pool_mode:           concat     # 'concat' or 'attention'
    dropout:             0.1
    grid_size:           5          # K x K image-feature grid per keypoint
    grid_radius:         0.1

  mask_embed_type: v2

data:
  datasets:
    - name: climbing
      config: configs/climbing.yaml
  val_ratio: 0.15
  seed:      42
  batch_size: 32
  num_workers: 16

loss:
  focal_alpha:     0.75   # >0.5 upweights the rare positive class
  focal_gamma:     2.0
  focal_weight:    5.0
  dice_weight:     0.5
  dice_eps:        1.0e-5
  sparsity_weight: 0.002

optim:
  lr:            1.0e-4
  weight_decay:  1.0e-4
  epochs:        20
  warmup_epochs: 1
  lr_min:        1.0e-5
  grad_clip:     1.0

output:
  dir:        ./train/output
  exp_name:   contact_climbing
  log_freq:   10
  val_freq:   1
  save_freq:  5
