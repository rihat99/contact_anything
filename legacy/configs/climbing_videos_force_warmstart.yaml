# Regime (a) — WARM START. Load the four-extremity contact branch from a trained
# contact checkpoint, FREEZE it, and train ONLY the force branch against the RNEA
# root-wrench physics residual (no force labels). The frozen model's MHR pose is
# provably unchanged; contact metrics stay logged but leave the objective.
base: configs/climbing_videos_joint.yaml

model:
  # Frozen contact branch is warm-started from the best per-frame contact run
  # (monitor test/joint_f1). Point this at your own best contact checkpoint before
  # launching; contact_temporal stays OFF so regime (a) reproduces its predictions.
  init_contact_checkpoint: output/climb4_frame_20260716_122726/best.pth
  force_head:
    enabled: true
    frame: local_world_aligned        # per-frame camera y-up axes (D6)

train:
  freeze_contact: true                # regime (a): contact frozen, force-only training

physics:
  enabled: true                       # RNEA root-wrench residual supervises the forces
  use_warp: true                      # fused CUDA FK/RNEA forward passes

data:
  eval_split: test                    # all generated-label scenes train; manual scenes evaluate
  frames_per_batch: 32                # per GPU -> 4 clips x T=8 (physics adds FK+RNEA/step)
  # FRAME-COUNT PITFALL (see contact/physics/loss.py residual scheme): residual
  # frames are {t : 2+r <= t <= T-3-r} with r = len(smoothing_kernel)//2. The
  # default kernel [0.25,0.5,0.25] (r=1) yields ZERO residual frames for T<7 — the
  # residual objective would be silently dead. T=8 -> residual frames {3,4} (2).
  sequence: {frames_per_clip: 8, frame_stride: 1, jitter: true}

logging:
  tensorboard_metrics: null           # log every scalar incl. physics/* (base uses a test/* allowlist)

output:
  exp_name: climb4_force_warmstart
  monitor: test/physics_residual      # minimised; the regularizer mix is excluded from "best"
