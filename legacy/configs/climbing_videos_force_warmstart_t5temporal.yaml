# Regime (a) warm-start from the TEMPORAL contact model (climb4_t5, T=5). Unlike
# climbing_videos_force_warmstart_temporal.yaml (which warm-starts a per-frame
# contact branch), here the frozen contact branch is temporal: BOTH the contact
# head and its contact_temporal module are warm-started from the trained T=5 run
# and frozen. Only the force branch (force tokens, head_force, force_temporal)
# trains against the RNEA root-wrench physics residual (no force labels).
#
# Enabled by two checkpoint.py properties: self-contained saving (the frozen
# contact + contact_temporal weights ride along in every checkpoint) and
# temporal-source warm start (initialize_common_contact accepts a temporal source
# when the target's temporal architecture is identical — the block below matches
# climb4_t5's temporal signature exactly, so contact_temporal.* simply loads).
base: configs/climbing_videos_force_warmstart.yaml

model:
  # Trained T=5 temporal contact run (configs/climbing_videos_joint_temporal.yaml,
  # monitor test/joint_f1). Its contact_temporal.* params load because the temporal
  # block below reproduces that run's temporal architecture signature exactly.
  init_contact_checkpoint: output/climb4_t5_20260716_183709/best.pth
  temporal:                             # EXACT match of climbing_videos_joint_temporal.yaml
    enabled: true
    placement: post_decoder
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                   # each limb mixes only with itself through time
    causal: false
    position_scale: 30.0                # 30-fps seconds -> well-separated frame offsets
  force_temporal:                       # force-token temporal block (same as the _temporal variant)
    enabled: true
    attend: per_token                   # each limb mixes only with itself through time
    position_scale: 30.0                # ~30-fps seconds -> well-separated frame offsets

data:
  # T MISMATCH — UNDER STUDY (pending measurement). The frozen contact_temporal
  # module was TRAINED at T=5 (climb4_t5); this run inherits T=8 from
  # climbing_videos_force_warmstart.yaml, chosen so the RNEA residual has >=1 valid
  # frame (default kernel [0.25,0.5,0.25] needs T>=7; T=8 -> residual frames {3,4}).
  # Whether a contact_temporal trained at T=5 behaves well over a longer T=8 window
  # is not yet measured. Revisit this tradeoff once the force objective is validated.
  sequence: {frames_per_clip: 8, frame_stride: 1, jitter: true}

output:
  exp_name: climb4_force_warmstart_t5src
