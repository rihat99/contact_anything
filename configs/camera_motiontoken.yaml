# Arm C-B (2026-09-03) — as configs/camera_posetoken.yaml but route B: a LEARNED motion token
# (pelvis-anchored, rides in the frozen decoder behind the asymmetric mask) joins the temporal
# block (K = 8 tokens/frame: pose + six contact + motion), the camera twist is ADDED to that
# token, and the per-token motion head reads it after the mixing. The pose token is untouched
# by the camera input here, so the SMPL-X head sees the camera only through the block.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,5 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/camera_motiontoken.yaml
base: configs/camera_posetoken.yaml

model:
  motion:
    source: tokens                    # one learned, pelvis-anchored motion token (keypoint_indices [9])
  cross_modal_temporal:
    modalities: [pose, contact, motion]

output:
  exp_name: camera_motiontoken
