# Stage-1 A v2 — s1_posecam_temporal + the two fixes/extensions from the s1 probe
# readout (1 epoch, GPUs 4+6):
#
#   * shape/scale RAIL — the s1 finetuned head drove the unsupervised 45
#     blendshape + 28 bone-scale channels to |x| ~ 5 (collapsed super-skinny
#     body on every rendered video; nothing in the objective sees girth). L2
#     pins both to the FROZEN readout's own outputs (shape_frozen/scale_frozen,
#     stashed by the final-recompute hook).
#   * kp_vel / kp_acc — differentiable WORLD-frame velocity/acceleration of the
#     predicted 13 keypoints over the T=7 window (central stencil on real
#     elapsed seconds) vs the finite-differenced kindyn joints_world. World,
#     not camera: the GT extrinsics remove camera egomotion exactly (loss-only
#     use), the GT side needs no transform, and the penalized signal is jitter
#     of the metric reconstruction itself — the explicit temporal objective
#     stage 1 lacked.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=4,6 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/s1_posecam_temporal_v2.yaml
base: configs/s1_posecam_temporal.yaml

pose_supervision:
  loss:
    shape_rail: 1.0                   # L2 per channel, summed over the 45 shape coeffs
    scale_rail: 1.0                   # same over the 28 bone-scale comps

keypoint_supervision:
  loss:
    kp_vel: 1.0                       # Huber delta 0.5 m/s (base default)
    kp_acc: 0.5                       # Huber delta 2.0 m/s^2 — model jitter sits deep in the
                                      # linear regime, so this weight is the smoothing pressure

output:
  exp_name: s1_posecam_temporal_v2
