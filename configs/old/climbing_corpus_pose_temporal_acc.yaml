# Pose E2b — corpus_pose_temporal_acc. E2 v1 (`climbing_corpus_pose_temporal.yaml`)
# moved the pose TOWARD kindyn (test pose MAE 0.0961 -> 0.0705 rad over 10 ep)
# but did NOT smooth it: the clip-wise pose-channel acceleration RMS stayed at
# ~5.7x the kindyn target's throughout. Per-frame matching is not a smoothness
# objective. This run adds the explicit one: `loss.acc` — Huber on the clip-wise
# SECOND DIFFERENCES of the 125 q channels, prediction vs target (valid frame
# triples). Weight 20 puts the two raw term magnitudes in the same ballpark
# (mae ~0.07 -> huber ~2.4e-3/chan; acc diff ~0.028 -> ~3.9e-4/chan). Watch the
# "smooth but wrong" failure mode: acc_ratio must fall WITHOUT mae rising.
base: configs/base.yaml

model:
  extra_token_attention: causal   # pinned 2026-08-27: the repo default flipped to mutual
  pose_temporal:
    enabled: true
    num_layers: 2
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # one pose token: per_token == joint
    bottleneck_dim: 256
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets

contact:
  targets:
    vertex: {enabled: false}
    joint: {enabled: false}           # pose-temporal-only build

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_pose.yaml}
  eval_split: test                    # no val split: train on all 331 scenes
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  # stride 1 (not auto): the auto stride is a motion_supervision-only feature;
  # pose targets are per-frame so the native rate is correct here.
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: all}

pose_supervision:
  enabled: true
  loss:
    pose: 1.0
    acc: 20.0                         # smoothness term (see header)
    huber_delta: 0.1                  # radians

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 10

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/pose/loss
  - train/pose/mae
  - test/loss
  - test/pose/mae
  - test/pose/acc_rms_pred
  - test/pose/acc_rms_gt
  - test/pose/acc_ratio
  - test/pose/n_rows

output:
  exp_name: corpus_pose_temporal_acc
  monitor: test/pose_mae              # minimised; acc_ratio is the smoothness readout
