# Motion E0b — corpus_motion_pelvis12_angw05, the PRODUCTION motion model.
# Identical to the retired 12-dim equal-weight baseline (E0) except the ANGULAR
# loss weights drop to 0.5: the 4-way equal split cost the linear velocity ~0.03 r3d vs the
# 6-dim v3 (0.448 vs 0.475 canonical) — this asks whether down-weighting the
# angular pair recovers it without giving back the angular gains (ang_vel 0.675
# / ang_acc 0.254 at weight 1.0).
base: configs/base.yaml

model:
  extra_token_attention: causal   # pinned 2026-08-27: the repo default flipped to mutual
  motion_head:
    enabled: true
    motion_keypoint_indices: [9]      # one token: pelvis (left-hip anchor)
  motion_temporal:
    enabled: true
    attend: joint                     # K=1: identical to per_token, kept for continuity
    num_layers: 2
    num_heads: 4
    mlp_ratio: 2.0
    bottleneck_dim: 256
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets

contact:
  targets:
    vertex: {enabled: false}
    joint: {enabled: false}           # motion-only: no contact branch at all

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_motion.yaml}
  eval_split: test                    # no val split: train on all 331 scenes
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  sequence: {frames_per_clip: 7, frame_stride: auto, jitter: true, target_frame: all}

motion_supervision:
  enabled: true
  target_frame: all
  joint_names: [pelvis]               # one slot; must match motion_keypoint_indices
  root_convention: twist              # BVR body twist (see the v3 header)
  angular: true                       # + body angular vel/acc -> 12-wide head/target
  target_smooth_sec: 0.12             # fixed-SECONDS label bandwidth
  loss:
    vel: 1.0
    acc: 1.0
    ang_vel: 0.5
    ang_acc: 0.5
    huber_delta: 1.0
    outlier_acc_ms2: 50.0             # unchanged: the cut stays on the LINEAR |acc|
  # Measured on the 331 curated corpus-TRAIN scenes under THIS target definition
  # (twist, smoothed 0.12 s, angular): target-valid frames minus the per-frame
  # outlier bit (106,603 of 106,621 kept), float64 — same protocol as v3; the
  # vel/acc rows reproduce v3's table exactly. Row = [[vel], [acc], [ang_vel],
  # [ang_acc]] in root axes: m/s, m/s^2, rad/s, rad/s^2. The head is zero-init,
  # so it starts by predicting exactly this mean.
  standardize:
    mean:
      - [[-0.01741,  0.04905,  0.03804], [-0.00093, -0.03626, -0.01106],
         [-0.01308,  0.00722, -0.00187], [-0.00788,  0.01342,  0.00159]]  # pelvis
    std:
      - [[ 0.29957,  0.35708,  0.30839], [ 1.24717,  1.34592,  1.23255],
         [ 0.48509,  0.67971,  0.45959], [ 2.45224,  4.00013,  2.27487]]  # pelvis

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 10

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/motion/loss
  - train/motion/vel
  - train/motion/acc
  - train/motion/ang_vel
  - train/motion/ang_acc
  - train/motion/vel_rmse
  - train/motion/acc_rmse
  - train/motion/ang_vel_rmse
  - train/motion/ang_acc_rmse
  - train/motion/n_outliers
  - test/loss
  - test/motion/vel_r3d_pelvis
  - test/motion/acc_r3d_pelvis
  - test/motion/ang_vel_r3d_pelvis
  - test/motion/ang_acc_r3d_pelvis
  - test/motion/vel_vert_r_pelvis
  - test/motion/acc_vert_r_pelvis
  - test/motion/vel_rmse_pelvis
  - test/motion/acc_rmse_pelvis
  - test/motion/ang_vel_rmse_pelvis
  - test/motion/ang_acc_rmse_pelvis
  - test/motion/n_rows

output:
  exp_name: corpus_motion_pelvis12_angw05
  # Same monitor as v3: the LINEAR acceleration r3d, so checkpoint selection is
  # comparable across the v3 -> v4 -> in-decoder ladder. Angular r3d is logged
  # alongside and reported by the probe.
  monitor: test/motion_acc_r3d_pelvis
