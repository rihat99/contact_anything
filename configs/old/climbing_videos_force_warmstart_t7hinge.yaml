# Regime (a) force run #4 — t7hinge. Successor to climbing_videos_force_warmstart_t7mid
# (stopped at epoch 11: monitored test residual stuck at 1.479 since epoch 1, and the
# rendered forces showed the measured ridge equilibrium — ‖f‖ smoothly increasing with
# p (corr 0.72), free limbs holding ~0.1 bw, 100% of label-free limb-frames > 0.05 bw.
# The soft (1−p)·‖f‖² tax shrinks force everywhere but its quadratic well always
# balances the residual pull at a nonzero magnitude; it cannot produce zeros).
# One deliberate change vs t7mid: the non-contact penalty becomes a hinge-gated L1.
#   kind: hinge_l1 — penalise ‖f‖ (not ‖f‖²): the constant slope at ‖f‖ → 0 creates a
#     dead zone, so a free limb's exact-zero force is a stationary point whenever the
#     penalty slope exceeds the residual pull.
#   p_lo 0.2 / p_hi 0.5 — full penalty at p <= 0.2, none at p >= 0.5: decouples
#     "kill force on confidently-free limbs" from "don't tax contact limbs" (t5mid's
#     probs average 0.31 on label-free limb-frames and 0.67 on label-contact; the
#     soft (1−p) weight taxed both).
#   weight 10 -> 25 — dead-zone condition per limb is (w/4)·hinge(p) > residual pull
#     (force part ≤ δ_f = 1, measured ≈ 0.45; typical torque-part pull ≈ 1–2 after the
#     ×20 weight). w = 25 gives slope 6.25 at full gate and ~3 at mid-ramp (p ≈ 0.35),
#     dominant with margin; the contact head stays frozen, so p is stationary.
#
# Self-contained override of base.yaml (flattened from the former include chain
# climbing_videos_joint.yaml -> _force_warmstart.yaml -> _force_warmstart_t7mid.yaml,
# now in legacy/configs/ except the kept joint config). Inlined rationale:
#
# Regime (a) — WARM START (from _force_warmstart.yaml): load the four-extremity
# contact branch from a trained contact checkpoint, FREEZE it, and train ONLY the
# force branch against the RNEA root-wrench physics residual (no force labels). The
# frozen model's MHR pose is provably unchanged; contact metrics stay logged but
# leave the objective.
#
# t7mid design (from _force_warmstart_t7mid.yaml), in causal order of the collapse
# pressure it addressed:
#   1. TORQUE residual weighted 20x the force residual. The force part of the root
#      wrench only pins the force SUM (the constant ~1 bw-up solution); the per-limb
#      ALLOCATION signal lives in the torque part, measured ~23x smaller (median
#      0.033 vs 0.74). The raw physical residual (monitor) stays UNWEIGHTED.
#   2. force_noncontact 2.0 -> 10.0 (-> 25.0 here): the airborne-limb penalty was
#      not strong enough (free limbs held ~0.2 bw at epoch 2).
#   3. T=7 / stride 1 / Gaussian smoothing: residual frames {2+r..T-3-r} = {3} —
#      the physics residual is computed for exactly the CENTRAL frame of each clip
#      (at stride 1 every source frame is the center of some window). The gated
#      force terms follow the residual frames (gate_frames: residual).
#   4. Contact comes from the t5mid CENTER-FRAME temporal checkpoint (test joint F1
#      0.9096 center@T=5, the best contact model on paper), frozen, seeing exactly
#      its native geometry: a centered 5-frame attention window inside the 7-frame
#      clip (model.temporal.window_frames) with window-relative time encoding.
#      t5mid genuinely uses context and collapses off its window (0.70 at T=16/s2)
#      — the window is what makes it safe to reuse here.
base: configs/base.yaml

model:
  extra_token_attention: causal   # pinned 2026-08-27: the repo default flipped to mutual
  # Frozen contact branch is warm-started from the t5mid CENTER-FRAME temporal
  # checkpoint (monitor test/joint_f1); point this at your own best contact
  # checkpoint before launching.
  init_contact_checkpoint: output/climb4_t5mid_20260717_140624/best.pth
  contact_head:
    contact_keypoint_indices: [62, 41, 13, 14]
    num_global_tokens: 0
    pool_mode: per_token
  # Contact temporal block — must byte-match the t5mid source architecture
  # (the former configs/climbing_videos_joint_temporal_center.yaml) or the warm
  # start hard-fails. window_frames is NOT part of the arch signature (an
  # attention-window choice, like frames_per_clip).
  temporal:
    enabled: true
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # t5mid: each limb mixes only with itself through time
    causal: false
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets
    window_frames: 5                  # central-5 window inside the T=7 clip (t5mid native T)
  force_head:
    enabled: true
    frame: local_world_aligned        # per-frame camera y-up axes (D6)
  # Force tokens attend the FULL 7-frame clip, and — unlike contact — jointly
  # across the four limbs: forces trade off against each other (the torque
  # balance couples them), so per-limb-only mixing withholds exactly the
  # cross-limb context the allocation problem needs.
  force_temporal:
    enabled: true
    attend: joint                     # limbs see each other across time
    position_scale: 30.0

contact:
  primary_target: joint
  targets:
    vertex: {enabled: false}
    joint:
      enabled: true
      joint_set: extremities_4        # left/right hand, then left/right foot (ankle OR foot)
      supervise_subset: null
      use_confidence_weights: true    # low-certainty labels have proportionally less influence
      loss: {focal_alpha: 0.60, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.0, sparsity_weight: 0.0}

train:
  freeze_contact: true                # regime (a): contact frozen, force-only training

physics:
  enabled: true                       # RNEA root-wrench residual supervises the forces
  use_warp: true                      # fused CUDA FK/RNEA forward passes
  max_cam_jump_m: 0.5                 # drop clips with reconstruction camera jumps
  # 3-tap Gaussian (sigma = 1 frame), replacing the binomial [0.25, 0.5, 0.25].
  # Radius stays 1 — any wider kernel would leave T=7 with zero residual frames.
  # Root motion is smoothed too: translation+pose linearly, root quaternion by
  # hemisphere-aligned slerp (contact/physics/loss.py::_smooth_configuration).
  smoothing_kernel: [0.27406862, 0.45186276, 0.27406862]
  loss:
    residual: 1.0
    residual_robust: {kind: pseudo_huber, delta_force: 1.0, delta_torque: 0.5}
    residual_force_weight: 1.0        # force part: sum-pinning, already dominant
    residual_torque_weight: 20.0      # torque part: the allocation signal, ~23x weaker — lift it to parity
    gate_frames: residual             # gate force terms on the residual (=center) frame only
    force_noncontact: 25.0            # hinge-gated L1 (see header) — was 10.0 soft_l2 in t7mid
    noncontact_gate: {kind: hinge_l1, p_lo: 0.2, p_hi: 0.5}
    force_at_contact: 0.0             # zero-init head has zero gradient at f=0; keep off
    force_smooth: 0.02
    force_l2: 0.001
    torque_l2: 0.001
    torque_smooth: 0.0

data:
  eval_split: test                    # all generated-label scenes train; manual scenes evaluate
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  # Stride 1 keeps dt = 1/30 s (finite-difference noise is higher than t16's
  # stride 2; the pseudo-Huber tail + Gaussian smoothing + jerk filter carry the
  # robustness instead). target_frame: center scores/loses contact on the center
  # frame only — the one frame whose windowed t5mid prediction is in-distribution.
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}
  # Retargeted from the exported ClimbingVideos_v1 to the corpus-direct loader
  # (v1 is legacy): labels = corpus contacts_1 with the same 52->22 fold; the
  # physics loss reads cam_from_world/gravity_world from the batch, which the
  # corpus loader always supplies (kindyn GT forces are NOT needed — plain
  # climbing_corpus.yaml, not the _forces variant); gravity_world is now exactly
  # [0, 1, 0] (the kindyn convention) instead of v1's camera-0 derivation; the
  # grouped split derives from scenes/scenes.db but yields the same 331 train scenes.
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus.yaml}

loss:
  grad_clip: 5.0                      # raw-norm telemetry stays on (train/grad_norm_raw)

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 30

logging:
  wandb: {enabled: false}             # keep this training run and its metadata local
  # Curated tensorboard set (wandb still receives every scalar). The full dump
  # (~70 series: per-extremity P/R/F1/F2, term masses, epoch timers) made TB
  # unnavigable; this is the decision-relevant core.
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/physics/loss
  - train/physics/raw_residual
  - train/physics/residual
  - train/physics/residual_force
  - train/physics/residual_torque
  - train/physics/residual_sat_frac
  - train/physics/force_noncontact
  - train/physics/force_smooth
  - train/physics/force_std
  - train/physics/n_eligible_clips
  - train/physics/n_jerk_excluded_clips
  - test/loss
  - test/joint/f1
  - test/physics/residual

output:
  exp_name: climb4_force_t7hinge
  monitor: test/physics_residual      # minimised; RAW unweighted residual — but note
  # the protocol changed vs t16 (T=7/s1, Gaussian kernel, 1 residual frame at dt=1/30):
  # numbers are NOT comparable to the t16 run's 0.271-constant baseline without
  # re-scoring baselines under THIS protocol (evaluate.py --warm-start does that).
