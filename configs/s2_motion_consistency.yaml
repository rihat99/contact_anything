# Stage-2 B — s2_motion_consistency. s2_motion + the pose->motion consistency
# loss in its v4 form (the collapse-proofed recipe: angular: false twist rows,
# absolute pos/rot anchors, cam + rot trust-region rails vs the frozen model's
# own outputs — now GENUINELY frozen anchors thanks to the split heads).
# Question: does consistency improve pose (depth wobble) and motion TOGETHER,
# with no camera/orientation escape, on the regenerated corpus?
#
# Launch:
#   CUDA_VISIBLE_DEVICES=<a>,<b> torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/s2_motion_consistency.yaml
base: configs/s2_motion.yaml

motion_consistency:
  enabled: true
  angular: false                      # linear-only twist comparison (v4 fix 1)
  loss:
    gt: 1.0                           # pose-derived twist vs kindyn GT
    head: 0.5                         # vs DETACHED motion head (grad -> pose only)
    huber_delta: 1.0                  # standardized units
    pos: 5.0                          # absolute world root position (Huber 0.1 m)
    pos_huber_m: 0.1
    rot: 2.0                          # absolute root orientation (Huber 0.1 rad)
    rot_huber_rad: 0.1
    cam_rail: 10.0                    # frozen-camera trust region
    cam_rail_margin_m: 0.5
    rot_rail: 10.0                    # frozen-orientation trust region (v4 fix 2)
    rot_rail_margin_rad: 0.2

output:
  exp_name: s2_motion_consistency
