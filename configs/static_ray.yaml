# Static-camera subset with the ray camera head: the pelvis is regressed as (bearing, log depth)
# about a fixed 3.5 m, so the crop box never enters the depth; the absolute anchors are the
# image-space kp2d term plus the log-depth / bearing Huber terms (no CLIFF `cam` term).
# Reference numbers (docs/results.md, static-camera round): the frozen model's lifted jitter is
# 126 on this 16-scene test set (GT 6.35); the earlier ray runs (with the now-removed frozen
# depth prior and camera token inputs) reached 52-57.
base: configs/base.yaml
model:
  cross_modal_temporal: {enabled: true, modalities: [pose, contact]}
  smplx: {enabled: true, hands: true, camera: ray}
data:
  datasets: [configs/datasets/climbing_videos_static.yaml]
  frames_per_batch: 120           # 2 clips/GPU (other users hold 10-18 GB per card)
  eval_max_frames: 120
contact_supervision: {weight: 5.0}
smplx_supervision:
  enabled: true
  kp2d_space: image
  loss: {hand_pose: 0.5, cam: 0.0, depth: 10.0, bearing: 2.0, huber_delta_2d: 0.02}
optim: {lr: 0.0002, weight_decay: 0.01, epochs: 30, lr_min: 1.0e-06}
output: {exp_name: static_ray, monitor: metric_pose/mpjpe, frozen_metrics: output/frozen_sam3d_smplx_static16.json}
