# All-modality v3 — corpus_allmod_consistency. `climbing_corpus_allmod.yaml`
# (CAUSAL decoder mask — the mutual mask goes back to its own ablation) plus the
# post-mortem-fixed consistency stack. corpus_allmod_mutual collapsed because
# the consistency loss supervised only world DERIVATIVES: a constant pred_cam_t
# is a null-space cheat under a mostly-static camera, and the run drove the
# camera to a constant 9 cm depth (kp2d ~12,000 px off-person) while q-space
# pose error stayed small; the bidirectional head term then dragged the motion
# head toward the depth-dead twist (vel_r3d 0.21 vs allmod 0.53). Three fixes:
#
#   1. ABSOLUTE anchors — `pos` (world mean-hips vs kindyn root + the measured
#      9 cm hip offset, Huber 0.1 m, every valid row incl. clip boundaries) and
#      `rot` (so3_log(R_pred^T R_gt), Huber 0.1 rad). Probe: frozen model sits
#      ~17 cm / ~7° from the kindyn root with NO constant rotation offset
#      (1.4°), so the loss starts near target and genuinely fights wobble.
#   2. DETACHED head term — the pose-derived twist is pulled toward the motion
#      head, never the reverse; the head learns from motion_supervision alone.
#   3. Camera trust region — `cam_rail`: zero within 0.5 m of the frozen
#      model's own pred_cam_t (stashed by the recompute hook), linear beyond.
#      Inert for a healthy model; the collapse optimum becomes unreachable.
#
# `force_supervision.loss.noncontact: 0.2` stays (the v2-proven weight).
# Comparison partner: corpus_allmod (same data, schedule, seed, monitor).
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/climbing_corpus_allmod_consistency.yaml
base: configs/climbing_corpus_allmod.yaml

force_supervision:
  loss:
    noncontact: 0.2                   # explicit zero-force pull on free limbs

motion_consistency:
  enabled: true
  loss:
    gt: 1.0                           # pose-derived twist vs kindyn GT
    head: 0.5                         # vs DETACHED motion head (grad -> pose only)
    huber_delta: 1.0                  # standardized units
    pos: 5.0                          # absolute world root position (Huber 0.1 m)
    pos_huber_m: 0.1
    rot: 2.0                          # absolute root orientation (Huber 0.1 rad)
    rot_huber_rad: 0.1
    cam_rail: 10.0                    # frozen-camera trust region
    cam_rail_margin_m: 0.5

output:
  exp_name: corpus_allmod_consistency
