# Arm M (2026-09-03) — the b8_lr2 recipe + train-time span masking of the temporal input.
#
# Contiguous spans of 1-5 frames (~15 % of a clip's frames) have ALL their tokens entering the
# cross-modal temporal block (pose + six contact slots) replaced by a learned per-slot mask
# embedding; the neighbours are untouched and every loss still scores the masked frames, so
# the block must reconstruct them from temporal context instead of passing each frame's own
# decoder token through (diag_temporal 2026-09-03: the block is near-uniform clip pooling and
# pose is unchanged when the window is closed to the frame itself). Eval is uncorrupted.
# Compared against temporal_tokens_b8_lr2_20260902_203707 (delta folds the optimizer bundle in).
#
# Launch:
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/masking.yaml
base: configs/temporal_tokens_b8_lr2.yaml

model:
  token_masking: {enabled: true}

output:
  exp_name: masking
