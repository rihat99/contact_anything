# Motion tokens v2 — corpus7_motion_t7. Dedicated motion tokens that cross-attend
# the image features inside the frozen decoder, regressing per-joint LINEAR
# velocity + acceleration (no angular, no forces, no contacts).
#
# Why: the v1 probe read the frozen decoder's EXISTING output tokens (pose token +
# 70 kp2D + 70 kp3D) through a temporal transformer and found they carry nothing
# about motion beyond the pose readout (token-0-only beat all 141; trajectory-only
# beat trajectory+tokens). The one untested escalation is a NEW information channel:
# tokens with their own image cross-attention and anchored local feature sampling
# (blur, background flow, scale change) that the pose-trained tokens had no
# incentive to keep.
#
# Motion-ONLY build: both contact targets disabled and force disabled -> no contact
# tokens, no contact head, no force tokens. The seven motion tokens carry their own
# MHR70 anchors:
#   [62, 41, 15, 18, 17, 20, 9] = L wrist, R wrist, L big-toe-tip, R big-toe-tip,
#                                 L heel, R heel, L HIP
# The first six match the kindyn group order [LH, RH, LF, RF, LA, RA]; the 7th is
# the PELVIS token. MHR70 has no pelvis keypoint (the model's own pelvis is
# mean(kp[9], kp[10])), so the token is anchored at the left hip — a
# feature-location choice, ~10 cm off. Its TARGET is the true kindyn pelvis joint
# (52-joint index 0), the v1-comparable quantity.
#
# Targets (contact/data/climbing_corpus.py::_load_motion): central differences of
# kindyn `joints_world` over the FULL scene trajectory at the scene's stored
# (fractional) fps, rotated world -> body-root with R(q_xyzw)^T — the identical
# convention v1 used, so the numbers are directly comparable. frame_stride MUST be
# 1 (the targets are native-rate derivatives).
#
# Loss (contact/motion_supervision.py): Huber (delta 1.0) on STANDARDIZED values,
# vel:acc 1:1, all clip frames supervised (v1 supervised every window frame; 7x the
# supervision per forward). Per-(frame, joint) outlier bit |acc_world| > 50 m/s^2
# zeroes both terms in TRAIN only — a per-frame drop would discard 14.3% of train
# frames while the pelvis alone is only 0.32%.
#
# T=7 / stride 1 with the mandatory motion temporal attention (post_decoder,
# zero-init gate, real-seconds sinusoidal encoding): a per-frame head provably
# cannot represent a derivative. attend: joint so the seven slots see each other.
base: configs/base.yaml

model:
  motion_head:
    enabled: true
    motion_keypoint_indices: [62, 41, 15, 18, 17, 20, 9]   # pelvis token LAST (left hip anchor)
  motion_temporal:
    enabled: true
    attend: joint                     # the seven slots see each other across time
    num_layers: 2                     # one layer + zero-init gate is marginal for a difference
    num_heads: 4
    mlp_ratio: 2.0
    bottleneck_dim: 256
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets

contact:
  targets:
    vertex: {enabled: false}
    joint: {enabled: false}           # motion-only: no contact branch at all

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_motion.yaml}
  eval_split: val                     # grouped-by-source-video holdout
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: all}

motion_supervision:
  enabled: true
  target_frame: all                   # supervise every clip row; eval still scores centers
  # This run predates the BVR-twist target and the fixed-seconds label smoothing:
  # its pelvis slot is R^T of the world central difference of the RAW fit. Both
  # pinned explicitly so the checkpoint stays reproducible now that the defaults
  # are `twist` / 0.12 s (twist differs by omega x v, ~7% of |a|).
  root_convention: rotated_world
  target_smooth_sec: 0.0
  loss:
    vel: 1.0
    acc: 1.0
    huber_delta: 1.0
    outlier_acc_ms2: 50.0
  # Measured on the 331 curated corpus-TRAIN scenes, target-valid frames, outliers
  # excluded per joint (106,621 frames). Rows follow motion_keypoint_indices order;
  # each row is [[vel_x, vel_y, vel_z], [acc_x, acc_y, acc_z]] in root axes,
  # m/s and m/s^2. Pinned as literals so the loss is reproducible from a stored
  # checkpoint config (a registered buffer would not be serialised).
  standardize:
    mean:
      - [[-0.01126,  0.04368,  0.03625], [-0.09806, -0.17142, -0.07958]]  # left_wrist
      - [[-0.01425,  0.05170,  0.03742], [ 0.13352, -0.15575, -0.07201]]  # right_wrist
      - [[-0.02121,  0.04807,  0.03728], [-0.21392,  0.39243,  0.02565]]  # left_foot  (toe)
      - [[-0.00597,  0.05514,  0.04464], [ 0.29446,  0.44817, -0.00732]]  # right_foot (toe)
      - [[-0.01968,  0.04666,  0.03753], [-0.18331,  0.35466,  0.06228]]  # left_ankle (heel)
      - [[-0.00837,  0.05383,  0.04444], [ 0.23883,  0.39318,  0.02895]]  # right_ankle(heel)
      - [[-0.01753,  0.04767,  0.03939], [-0.00928,  0.01295,  0.05692]]  # pelvis
    std:
      - [[0.48643, 0.61249, 0.44954], [10.14953, 8.27373,  8.45333]]      # left_wrist
      - [[0.45844, 0.63724, 0.44039], [10.05418, 8.15900,  8.39553]]      # right_wrist
      - [[0.75087, 0.61724, 0.80988], [ 9.74876, 7.17551, 10.06051]]      # left_foot
      - [[0.74963, 0.60261, 0.83314], [ 9.90382, 7.27931, 10.20008]]      # right_foot
      - [[0.68807, 0.58163, 0.73546], [ 8.93684, 6.57857,  9.25493]]      # left_ankle
      - [[0.67952, 0.56559, 0.75340], [ 9.21469, 6.70757,  9.41348]]      # right_ankle
      - [[0.36104, 0.41406, 0.36967], [ 4.07114, 3.52943,  4.34479]]      # pelvis

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 30

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/motion/loss
  - train/motion/vel
  - train/motion/acc
  - train/motion/vel_rmse
  - train/motion/acc_rmse
  - train/motion/n_outliers
  - val/loss
  # Pre-registered bars are PELVIS-only; the `_mean` tags are the 7-joint average
  # (limb targets are 2-3x noisier) and must never be read against a pelvis bar.
  - val/motion/vel_vert_r_pelvis
  - val/motion/acc_vert_r_pelvis
  - val/motion/vel_rmse_pelvis
  - val/motion/acc_rmse_pelvis
  - val/motion/vel_vert_r_mean
  - val/motion/acc_vert_r_mean
  - val/motion/vel_rmse_mean
  - val/motion/acc_rmse_mean
  - val/motion/n_rows

output:
  exp_name: corpus7_motion_t7
  # Maximised — the quantity the pre-registered v1 bars are stated on (pelvis
  # world-vertical acceleration Pearson r; v1 T=7 token probe = 0.286). NOT
  # val/loss: ~31% of val loss entries are outlier (|acc_world| > 50) rows that
  # carry no training gradient at all (eval is never filtered), so val/loss
  # tracks target noise as much as skill. Monitor names use a single slash
  # (`{split}/motion_<key>`, the val/force_mae convention); the same number is
  # logged under the `val/motion/<key>` tag above.
  monitor: val/motion_acc_vert_r_pelvis
