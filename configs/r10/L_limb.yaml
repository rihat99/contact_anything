# Round 10 arm L: seven tokens per frame instead of one. The body token keeps the pose token and
# the trajectory geometry; the six decoder contact tokens move to a limb token each, together with
# that extremity's root-frame position, its one-sided body-frame rates and its crop position / log
# depth ratio. The transformer alternates attention along time (per slot) with attention across the
# seven slots of a frame; the contact and force heads read the limb tokens, and the forces are read
# in a gravity-aligned frame (the GT hand directions are spread in the root frame, mean resultant
# length 0.79, and tight about gravity, 0.88-0.90). The decoder contact tokens need the LIVE decoder,
# so this arm runs off the embedding cache: 4 GPUs x 4 clips x accumulate 2 = the recipe's 32 clips
# per step (240 frames per GPU leaves room next to other users' jobs).
base: configs/r10/D16.yaml
model:
  contact: {enabled: true}
  refiner:
    limb_tokens: true
    contact_token_dim: 256
    force_frame: gravity
data: {pose_token_cache: false, embedding_cache: true, frames_per_batch: 240}
optim: {accumulate_steps: 2}
output: {exp_name: L_limb}
