# L_body with the temporal block run in one pass: no iterative per-layer refinement (the pose head
# reads the final layer only, no per-layer feedback, no deep supervision) and the LIVE backbone
# (the embedding cache is gone). 4 GPUs x 4 clips x accumulate 2 = the recipe's 32 clips per step;
# 4 epochs.
base: configs/r10/L_body.yaml
model:
  refiner: {iterative: false}
contact_supervision: {layer_weight: 0.0}
force_supervision: {layer_weight: 0.0}
smplx_supervision: {layer_weight: 0.0}
motion_supervision: {layer_weight: 0.0}
gravity_supervision: {layer_weight: 0.0}
data: {embedding_cache: false, frames_per_batch: 240}
optim: {epochs: 4}
output: {exp_name: L_body_noiter}
