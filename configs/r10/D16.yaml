# Round 10 control, and the root every other round-10 config inherits from: the round-9 recipe
# (arm D, `output_4/D_total_feet_20260913_134817`) on this round's 16-epoch schedule, so the
# limb-token arm is read against a run of the same length. 1 GPU x 8 clips x accumulate 4 = 32
# clips per step.
#
# Self-contained on the schema: rounds 7-9 reached this recipe through a chain of one-change arms
# (configs/smooth/ -> configs/r8/ -> configs/r9/), all trashed on 2026-09-19; the comments below
# carry why each setting is what it is. Write-ups: docs/round7..round10.
base: configs/base.yaml

model:
  decoder_checkpointing: true
  contact: {enabled: false}                # no decoder contact tokens; the refiner's own head is the contact output
  smplx: {enabled: true, hands: true, checkpoint: checkpoints/stage1_20260905_180319/best.pth, frozen: true}
  refiner:
    enabled: true
    outputs: [pose, gravity, contact, force]
    num_layers: 3
    # Round 7: the block produces the smooth body ITSELF — no input Gaussians (root_smooth_sec /
    # pose_smooth_sec stay 0), one-sided rates in the token and one-sided stencils in the losses.
    # A central first difference has exactly zero response to the period-2 wobble the lifted-jitter
    # metric weighs most, so it cannot see (or fix) it. `joint_velocity`: the articulation token
    # otherwise carries only absolute rotations, and filtering an absolute channel needs a
    # subtraction the block has to learn; with the rates a correction is a signed sum of neighbours.
    token: {local_rotations: true, one_sided_velocity: true, joint_velocity: true}
    iterative: true                        # layers run one at a time, the shared pose head applies after
                                           # each, and the corrected trajectory's own rates feed back
    camera_context: true
    camera_axes: true                      # the camera's tilt in the body frame = the gravity head's input
    gravity_input: {enabled: true, eval_given: false}   # gravity GIVEN on half the measured clips in
                                           # training; the eval pass scores the guessing path (the
                                           # `*_given_eval` twins flip eval_given)
    head_grad_scale: 0.3                   # what the contact / force / gravity heads send into the shared
                                           # trunk: 1.0 = best forces at jitter 7.7, 0.1 = jitter 4.9 and
                                           # force MAE +0.010; 0.3 is the middle of that trade

data:
  pose_token_cache: true                   # frozen FINAL pose tokens from features/pose_token (no image, no decoder)
  frames_per_batch: 480                    # 8 x 60-frame clips per GPU
  interleave_videos: true
  eval_max_frames: 120

contact_supervision: {layer_weight: 0.5}   # deep supervision: every layer's logits are scored (half weight)
force_supervision:
  enabled: true
  layer_weight: 0.5
  loss:
    magnitude: 1.0                         # round 9: the joint-torque term alone LOWERED the hands instead of
    sum_force: 1.0                         # loading the feet — nothing held the total. `sum_force` anchors the
                                           # six-group total to the kindyn total per frame; the toes get a
                                           # magnitude term the group weights then apply to
    group_weights: [1.0, 1.0, 2.5, 2.5, 1.0, 1.0]    # the two toe groups
smplx_supervision:                         # the per-frame body is frozen; these score / anchor the refined one
  enabled: true
  layer_weight: 0.5
  loss: {kp2d: 0.0, kp3d: 10.0, pose: 2.0, betas: 0.0, cam: 0.0, root_bias: 2.0, root_shape: 2.0}
motion_supervision:
  enabled: true
  label_smooth_sec: 0.0                    # the target is the RAW kindyn trajectory
  stencil: forward
  scale: {vel: 0.4, acc: 1.2, ang_vel: 0.57, ang_acc: 1.8}
  layer_weight: 0.5
  loss:                                    # no motion head: only the refined pose's own derivatives, and
    vel: 0.0                               # velocity only — a pointwise loss on raw second differences
    acc: 0.0                               # (target correlation 0.14) is minimised by shrinking, which cost
    ang_vel: 0.0                           # round 7 arm A ~0.2 of the GT velocity amplitude and 8 mm MPJPE
    ang_acc: 0.0
    pose_vel: 1.0
    pose_ang_vel: 1.0
force_consistency:                         # RNEA root-wrench residual of the refined motion under the predicted forces
  enabled: true
  loss:
    force: 5.0                             # round 9: the force part tightened (delta 0.2 bw) once the total was pinned
    torque: 20.0                           # the linear part was ~2.4x the angular one at the round-8 weights
    joint_torque: 0.3                      # strength-weighted joint torques (BVR's table, detached body, live forces)
    huber_delta_force: 0.2
contact_consistency: {enabled: true}       # in-contact extremity speed (forward stencil), gradient into the pose path
gravity_supervision:                       # the predicted down vector vs the corpus gravity, MEASURED scenes only
  enabled: true
  weight: 5.0                              # at 1.0 the term (1 - cos 13 deg = 0.026 per clip) was invisible next
  layer_weight: 0.5                        # to the pose terms and the head did not move in three epochs

optim: {lr: 3.0e-4, weight_decay: 0.01, epochs: 16, accumulate_steps: 4, warmup_steps: 300, lr_min: 1.0e-6}
output:
  dir: ./output_5
  exp_name: D16
  frozen_metrics: checkpoints/round3_refiner_eval.json   # the round-3 refiner's eval.json as the tensorboard reference line
