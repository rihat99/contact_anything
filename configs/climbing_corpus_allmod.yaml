# All-modality run — corpus_allmod. Every token block the model has — pose,
# contact (kindyn_6), force (kindyn_6) and motion (pelvis) — trained together
# through the two new bricks and NOTHING else:
#
#   * `cross_modal_temporal` over [pose, contact, force, motion]: the 14-token
#     concatenation (1 + 6 + 6 + 1) attends jointly across the T=7 clip, so
#     every modality sees every other at every frame. This is the ONLY
#     cross-frame path: all per-modality temporal blocks are off.
#   * `frame_attn` on all four modalities: after the temporal block, each
#     modality's own zero-gated per-frame module re-reads the full
#     post-temporal token set of its frame (no temporal mixing).
#   * `train.finetune_pose_head`: head_pose.proj joins the optimizer at 0.1x lr.
#
# 'pose' is a WRITTEN modality in both bricks and the head is fine-tuned, so
# pose_supervision (kindyn-MHR pseudo-GT, plain q-Huber) anchors it. Deliberate
# exclusions per the experiment definition: NO pose smoothness term
# (pose_supervision.loss.acc stays 0 — that was the E2b arm), NO cond_input
# vel/acc conditioning of the tokens, NO per-modality temporal blocks.
#
# Supervision = the four production objectives, unchanged from their sources:
# contact + forces from corpus6_jf_cond_sum1_postdec (minus cond_input), motion
# from corpus_motion_pelvis12_angw05 (ang weights 0.5), pose from the E2-v1
# plain q loss. Data matches the force line (T=7, stride 1, center rows for
# contact/force) so test/force_mae stays directly comparable to it; motion and
# pose supervise all rows. Note stride 1 (not the motion line's `auto`): the
# smoothed twist labels stay fps-agnostic, only the input window's physical
# span varies with scene fps.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/climbing_corpus_allmod.yaml
base: configs/base.yaml

model:
  init_contact_checkpoint: null       # train the whole stack from scratch
  contact_head:
    contact_keypoint_indices: [62, 41, 15, 18, 17, 20]   # = the force anchors (1:1 groups)
    num_global_tokens: 0
    pool_mode: per_token
  force_head:
    enabled: true
    force_keypoint_indices: [62, 41, 15, 18, 17, 20]
    frame: root                       # body-root frame — no extrinsics in this experiment
    contact_gate:
      enabled: true                   # f = f_raw * sigmoid(sharpness * detached contact logit)
      sharpness: 4.0
  motion_head:
    enabled: true
    motion_keypoint_indices: [9]      # one token: pelvis (left-hip anchor)
  cross_modal_temporal:
    enabled: true
    modalities: [pose, contact, force, motion]
    bottleneck_dim: 256
    num_layers: 2
    num_heads: 4
    mlp_ratio: 2.0
    causal: false
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets
  frame_attn:
    enabled: true
    modalities: [pose, contact, force, motion]
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0

contact:
  primary_target: joint
  targets:
    vertex: {enabled: false}
    joint:
      enabled: true
      joint_set: kindyn_6             # LH, RH, L/R foot (big-toe), L/R ankle (heel)
      supervise_subset: null
      use_confidence_weights: true    # low-certainty labels have proportionally less influence
      loss: {focal_alpha: 0.60, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.0, sparsity_weight: 0.0}

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_all.yaml}
  eval_split: test                    # no val split: all 331 train scenes train, manual test evaluates
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}

force_supervision:
  enabled: true
  target_frame: center                # supervise row T//2 only; the window still informs it
  loss:
    force: 1.0
    huber_delta_bw: 0.1
    outlier_bw: 4.0
    noncontact: 0.0                   # the contact gate does this job
    sum_force: 1.0                    # net-force consistency (see the cond_sum1 header)
    sum_torque: 0.25                  # net-torque consistency (bw*m lever arms)
    huber_delta_bwm: 0.1
    group_weights: [1.0, 1.0, 2.0, 2.0, 2.0, 2.0]   # [LH, RH, LF, RF, LA, RA]

motion_supervision:
  enabled: true
  target_frame: all
  joint_names: [pelvis]               # one slot; must match motion_keypoint_indices
  root_convention: twist              # BVR body twist (see the pelvis v3 header)
  angular: true                       # + body angular vel/acc -> 12-wide head/target
  target_smooth_sec: 0.12             # fixed-SECONDS label bandwidth
  loss:
    vel: 1.0
    acc: 1.0
    ang_vel: 0.5                      # angw05 production weights: down-weighted angular
    ang_acc: 0.5                      # supervision recovered the linear-vel dip
    huber_delta: 1.0
    outlier_acc_ms2: 50.0
  # The angw05 table verbatim (twist, smoothed 0.12 s, angular; 331 train
  # scenes, float64). Rows: [[vel], [acc], [ang_vel], [ang_acc]] in root axes.
  standardize:
    mean:
      - [[-0.01741,  0.04905,  0.03804], [-0.00093, -0.03626, -0.01106],
         [-0.01308,  0.00722, -0.00187], [-0.00788,  0.01342,  0.00159]]  # pelvis
    std:
      - [[ 0.29957,  0.35708,  0.30839], [ 1.24717,  1.34592,  1.23255],
         [ 0.48509,  0.67971,  0.45959], [ 2.45224,  4.00013,  2.27487]]  # pelvis

pose_supervision:
  enabled: true
  loss:
    pose: 1.0
    acc: 0.0                          # NO smoothness term (that was the E2b arm)
    huber_delta: 0.1                  # radians

train:
  compile_backbone: true              # torch.compile the frozen, FLOP-bound backbone
  finetune_pose_head: true            # head_pose.proj at lr x pose_head_lr_scale (0.1)

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 20

# tensorboard_metrics stays null (base default): four loss families — log every scalar.

output:
  exp_name: corpus_allmod
  monitor: test/force_mae             # minimised; keeps the force line directly comparable
