# All-modality v4 — corpus_allmod_consistency_v4. The v3 stack
# (climbing_corpus_allmod_consistency.yaml) with the two fixes its collapse
# probe dictated. v3 solved the CAMERA collapse (rail held: cam_dev bounded
# ~0.35 m, kp2d 215 px vs mutual's 12,280; per-clip root-pos std stayed live)
# but the twist terms drained the smoothness pressure into the one unrailed
# channel: the world ORIENTATION was pinned near-constant within clips
# (spread 0.21° vs GT 2.85°) and parked ~55° from GT — the angular residuals
# (frozen ~7°/frame wobble differenced at 30 fps, standardized by the small GT
# angular std) made a constant orientation the optimum, and the rot anchor
# (w=2) was ~10× too weak to stop it. Two changes, weights otherwise
# unchanged for clean attribution vs v3:
#
#   1. angular: false — the gt/head twist comparison drops the angular rows
#      (linear vel/acc only). The noise source that rewards orientation
#      constancy is gone; the motion head keeps full 12-dim supervision.
#   2. rot_rail — orientation trust region vs the FROZEN model's own
#      global_rot (geodesic, zero inside 0.2 rad ≈ 11.5°, linear beyond),
#      mirroring cam_rail. Inert for a healthy model.
#
# Comparison partners: corpus_allmod (no consistency, the bar) and
# corpus_allmod_consistency (v3, rot collapse).
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/climbing_corpus_allmod_consistency_v4.yaml
base: configs/climbing_corpus_allmod.yaml

force_supervision:
  loss:
    noncontact: 0.2                   # explicit zero-force pull on free limbs

motion_consistency:
  enabled: true
  angular: false                      # linear-only twist consistency (v3 fix 1)
  loss:
    gt: 1.0                           # pose-derived twist vs kindyn GT
    head: 0.5                         # vs DETACHED motion head (grad -> pose only)
    huber_delta: 1.0                  # standardized units
    pos: 5.0                          # absolute world root position (Huber 0.1 m)
    pos_huber_m: 0.1
    rot: 2.0                          # absolute root orientation (Huber 0.1 rad)
    rot_huber_rad: 0.1
    cam_rail: 10.0                    # frozen-camera trust region
    cam_rail_margin_m: 0.5
    rot_rail: 10.0                    # frozen-orientation trust region (v3 fix 2)
    rot_rail_margin_rad: 0.2

output:
  exp_name: corpus_allmod_consistency_v4
