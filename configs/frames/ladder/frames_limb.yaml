# Round 12 ladder, rung 5 — configs/final/final_limb.yaml (+ contact limb tokens: 35 decoder contact
# tokens and 35 refiner limb tokens, live decoder on two GPUs) on the 35 contact frames (the
# climbing_frames35 recipe, see frames_base.yaml). The six-group ladder's rung 6 (force tokens) has
# no counterpart: the frames35 model reads both heads off the one set of contact tokens.
base: configs/final/final_limb.yaml
data:
  contact_set: frames35
model:
  force: {enabled: false}
  refiner: {force_tokens: false}
contact_supervision:
  weight: 5.8333                        # 35 / 6: the per-slot gradient of the six-group recipe
force_supervision:
  loss: {group_weights: null}
output: {dir: ./output_8, exp_name: frames_limb}
