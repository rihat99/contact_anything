# Round 12 ladder, rung 1 — configs/final/final_base.yaml (token heads on the frozen pose token, no
# temporal model) with contact and force on the 35 contact frames (data.contact_set: frames35, the
# climbing_frames35 recipe: per-slot BCE at weight 35/6, uniform force weights, no force tokens).
base: configs/final/final_base.yaml
data:
  contact_set: frames35
model:
  force: {enabled: false}
  refiner: {force_tokens: false}
contact_supervision:
  weight: 5.8333                        # 35 / 6: the per-slot gradient of the six-group recipe
force_supervision:
  loss: {group_weights: null}
output: {dir: ./output_8, exp_name: frames_base}
