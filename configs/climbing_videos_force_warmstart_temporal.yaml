# Regime (a) warm-start + a FORCE-token temporal block (step 05). The frozen
# contact branch stays per-frame (warm-started, no contact temporal); only the
# force tokens get cross-frame attention. force_temporal params are force-named, so
# the warm start leaves them fresh and trainable while contact stays frozen.
base: configs/climbing_videos_force_warmstart.yaml

model:
  force_temporal:
    enabled: true
    attend: per_token                 # each limb mixes only with itself through time
    position_scale: 30.0              # ~30-fps seconds -> well-separated frame offsets

physics:
  loss:
    residual: 1.0                     # RNEA root-wrench objective

optim:
  lr: 2.0e-4                          # global batch is 64 frames (half the contact run)
  warmup_epochs: 0                    # do not hold the zero-init force head at 1% LR for an epoch

output:
  exp_name: climb4_force_warmstart_t8
