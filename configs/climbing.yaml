name: climbing

# --- loader: the prebuilt, self-contained SMPL dataset ---------------------
# ClimbingImagesDataset reads this; everything it needs is a flat copy here.
data:
  root: /data3/rikhat.akizhanov/datasets/ClimbingImages_v1

# --- builder: dataset/build_climbing_v1.py reads this -----------------------
# Walks the BetterImageReconstruction outputs, keeps climbers whose SMPL-X
# contact_surface count is in [min_contacts, max_contacts], converts
# SMPL-X -> SMPL (contacts + params), and writes the dataset to `out`.
build:
  source_root: /data3/rikhat.akizhanov/better/data/ClimbingImages
  # db: /path/to/image_reconstruction.db   # default: {source_root}/image_reconstruction.db
  require: [human_optim]
  min_contacts: 50           # drop climbers with < this many contact verts (SMPL-X)
  max_contacts: 3000         # drop climbers with > this many contact verts (SMPL-X)
  out: /data3/rikhat.akizhanov/datasets/ClimbingImages_v1
