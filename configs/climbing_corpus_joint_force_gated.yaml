# Joint contact+force run — corpus6_joint_force_gated_t7. Brings a contact branch
# back next to the supervised six-group force branch (corpus6_force_sup_t7_v2, best
# test/force_mae 0.1564) and couples them through a contact-gated force output.
#
# Contact branch: SIX contact tokens matched 1:1 to the six kindyn force groups
# (joint_set kindyn_6, anchors = the force anchors below). The training recipe is
# climb4_t5mid_v2's (per_token pooling + per_token temporal attention, focal
# 0.60/2.0 x5, confidence weights) on T=7 clips, trained FROM SCRATCH — no warm
# start (the four-extremity checkpoints have a different output space). Labels
# reduce from the body-22 labels with single sources per group: hands = the wrists
# (fingers already folded there — identical to extremities_4's hand sourcing),
# toe groups = the foot joints, heel groups = the ankles; the manual test split
# annotates all six source joints, so every group is test-supervised.
#
# Force branch = unchanged from the supervised v2 run: six force tokens with their
# own anchors [62, 41, 15, 18, 17, 20] (kindyn order LH, RH, LF=toe, RF=toe,
# LA=heel, RA=heel), body-root frame, joint force-temporal attention, Huber delta
# 0.1 bw, outlier cut 4 bw, legs-x2 group weights.
#
# NEW — contact-gated force output (model.force_head.contact_gate): the FINAL force
# output is f_raw * sigmoid(4 * detached contact logit), each force group gated by
# its own matched contact output (heel force by ankle contact, toe force by foot
# contact — the map is the identity). A confident contact (logit 1.0) passes ~0.98
# of the raw force; a confident free limb is squashed to ~0. This REPLACES the
# noncontact zero-force loss (weight 0.0 here) — the gate enforces zero force on
# free limbs structurally instead of through a penalty. The logits are detached,
# so the force loss cannot rewrite the calibrated contact probabilities (contact
# keeps training purely from its labels).
#
# NEW — net-force and net-torque consistency terms (sum_force / sum_torque): Huber
# on the six-group force sum and on sum(r x f) vs GT, with r = the loader's
# root-frame pelvis->joint lever arms. Both weighted 0.25 — deliberately WEAKER
# than the per-group force term: a sum objective that dominates the per-group one
# recreates the physics-loss geometry whose constant-sum optimum collapsed run #1
# (see climbing_corpus_force_supervised.yaml header).
base: configs/base.yaml

model:
  init_contact_checkpoint: null       # train the six-token contact stack from scratch
  contact_head:
    contact_keypoint_indices: [62, 41, 15, 18, 17, 20]   # = the force anchors (1:1 groups)
    num_global_tokens: 0
    pool_mode: per_token
  temporal:
    enabled: true
    placement: post_decoder
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # each group mixes only with itself through time
    causal: false
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets
  force_head:
    enabled: true
    force_keypoint_indices: [62, 41, 15, 18, 17, 20]
    frame: root                       # body-root frame — no extrinsics in this experiment
    contact_gate:
      enabled: true                   # f = f_raw * sigmoid(sharpness * detached contact logit)
      sharpness: 4.0
  force_temporal:
    enabled: true
    attend: joint                     # groups see each other across time (allocation coupling)
    position_scale: 30.0

contact:
  primary_target: joint
  targets:
    vertex: {enabled: false}
    joint:
      enabled: true
      joint_set: kindyn_6             # LH, RH, L/R foot (big-toe), L/R ankle (heel)
      supervise_subset: null
      use_confidence_weights: true    # low-certainty labels have proportionally less influence
      loss: {focal_alpha: 0.60, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.0, sparsity_weight: 0.0}

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_forces.yaml}
  eval_split: test                    # no val: all 331 train scenes train, manual test evaluates
  frames_per_batch: 35                # per GPU -> 5 clips x T=7. Not a lever: the frozen
                                      # backbone is FLOP-saturated (throughput flat 35 -> 210)
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}

force_supervision:
  enabled: true
  target_frame: center                # supervise row T//2 only; the window still informs it
  loss:
    force: 1.0
    huber_delta_bw: 0.1
    outlier_bw: 4.0
    noncontact: 0.0                   # the contact gate does this job now (see header)
    sum_force: 0.25                   # net-force consistency — must stay weaker than force
    sum_torque: 0.25                  # net-torque consistency (bw*m lever arms)
    huber_delta_bwm: 0.1
    group_weights: [1.0, 1.0, 2.0, 2.0, 2.0, 2.0]   # [LH, RH, LF, RF, LA, RA]

train:
  compile_backbone: true              # torch.compile the frozen, FLOP-bound backbone

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 30

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/joint/f1
  - train/force_sup/loss
  - train/force_sup/force
  - train/force_sup/sum_force
  - train/force_sup/sum_torque
  - train/force_sup/mae
  - train/force_sup/noncontact_mag
  - train/force_sup/n_outliers
  - test/loss
  - test/joint/precision
  - test/joint/recall
  - test/joint/f1
  - test/force_sup/mae

output:
  exp_name: corpus6_joint_force_gated_t7
  monitor: test/force_mae             # minimised; mean |pred - gt| on in-contact limb-frames (bw)
