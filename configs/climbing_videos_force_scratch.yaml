# Regime (b) — FROM SCRATCH. Train the four-extremity contact head (from labels)
# AND the force branch (from the RNEA physics residual) JOINTLY. Contact stays the
# headline metric; the physics residual is logged alongside.
base: configs/climbing_videos_joint.yaml

model:
  init_contact_checkpoint: null       # train the full contact + force stack from scratch
  force_head:
    enabled: true
    frame: local_world_aligned        # per-frame camera y-up axes (D6)

train:
  freeze_contact: false               # regime (b): contact + force train together

physics:
  enabled: true                       # RNEA root-wrench residual supervises the forces

data:
  eval_split: val                     # grouped-holdout val (automatic labels)
  frames_per_batch: 32                # per GPU -> 4 clips x T=8 (physics adds FK+RNEA/step)
  # FRAME-COUNT PITFALL (see contact/physics/loss.py residual scheme): T=8 + the
  # default kernel [0.25,0.5,0.25] (r=1) -> residual frames {3,4} (2); T<7 would
  # silently disable the residual objective (zero residual frames).
  sequence: {frames_per_clip: 8, frame_stride: 1, jitter: true}

logging:
  tensorboard_metrics: null           # log every scalar incl. physics/* (base uses a test/* allowlist)

output:
  exp_name: climb4_force_scratch
  monitor: val/joint_f1               # physics residual is logged; switch the monitor once contact plateaus
