# Base config: every allowed key with its default. Experiment yamls set
# `base: configs/base.yaml` and override; unknown keys hard-error.
base: null

model:
  checkpoint_path: /data3/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/model.ckpt
  mhr_model_path: /data3/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/assets/mhr_model.pt
  extra_token_attention: mutual       # mutual | causal — decoder mask among the appended token blocks
  contact:
    enabled: true
    keypoint_indices: [62, 41, 15, 18, 17, 20]   # MHR70 anchors, kindyn_6 order
    num_global_tokens: 0
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
    grid_size: 5
    grid_radius: 0.1
    blind_to_image: false             # ablation: no image path into the contact tokens
  force:
    enabled: false
    keypoint_indices: null            # null = inherit the contact anchors
    frame: root                       # root (supervised GT) | local_world_aligned | local (physics)
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
    contact_gate: {enabled: false, sharpness: 4.0}
  motion:
    enabled: false
    keypoint_indices: [9]             # one pelvis token; output = 12-dim gravity-view twist
    anchored: true
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
  cross_modal_temporal:
    enabled: false
    modalities: [contact, force]      # >= 2 of pose|contact|force|motion
    num_layers: 4
    num_heads: 16
    mlp_ratio: 2.0
    dropout: 0.0
    time_scale: 25.0
    max_rel_sec: 2.5
  pose_temporal:
    enabled: false
    num_layers: 4
    num_heads: 16
    mlp_ratio: 2.0
    dropout: 0.0
    time_scale: 25.0
    max_rel_sec: 2.5
  finetune_pose_head: false
  finetune_camera_head: false

mhr_body:                             # BetterHuman MHR archive (pose loss q-space, physics adapter)
  model_path: null                    # null -> $BETTERHUMAN_MODELS_DIR, then the sibling ../BetterHuman
  lod: 1

data:
  datasets: [configs/datasets/climbing_videos.yaml]
  embedding_cache: true
  frames_per_batch: 240               # per GPU; clips per batch = frames_per_batch // clip.frames
  num_workers: 8
  seed: 42
  clip: {frames: 60, stride: auto, jitter: true}
  eval_max_frames: 360

contact_supervision:
  enabled: true
  confidence_weights: true
  focal_alpha: 0.5
  focal_gamma: 2.0
  weight: 5.0

force_supervision:
  enabled: false
  confidence: true
  loss:
    force: 1.0
    huber_delta_bw: 0.5
    outlier_bw: 4.0
    noncontact: 1.0
    sum_force: 0.0
    sum_torque: 0.0
    huber_delta_bwm: 0.1
    group_weights: null

motion_supervision:
  enabled: false
  target_smooth_sec: 0.12
  outlier_acc_ms2: 50.0
  standardize: {mean: null, std: null}   # [1][4][3] pelvis (vel, acc, ang_vel, ang_acc)
  loss: {vel: 1.0, acc: 1.0, ang_vel: 1.0, ang_acc: 1.0, huber_delta: 1.0}

pose_supervision:
  enabled: false
  loss: {pose: 1.0, huber_delta: 0.1, shape: 0.0, bones: 0.0, scale: 0.0, huber_delta_bones: 0.05}

keypoint_supervision:
  enabled: false
  joint_weights: {fingers: 0.1, face: 1.0}
  loss:
    kp2d: 1.0
    kp3d: 0.5
    kp3d_abs: 0.25
    kp_vel: 0.0
    kp_acc: 0.0
    vert: 0.0
    vert_abs: 0.0
    huber_delta_2d: 0.05
    huber_delta_3d: 0.1
    huber_delta_vel: 0.5
    huber_delta_acc: 2.0
    outlier_acc: 50.0
    cam_rail: 0.0
    rot_rail: 0.0
    cam_rail_margin_m: 0.5
    rot_rail_margin_rad: 0.2

contact_consistency:
  enabled: false
  detach_gate: true
  loss: {vel: 0.5, huber_delta_ms: 0.5}

force_consistency:
  enabled: false
  ramp: {start_epoch: 3, epochs: 3}
  smoothing_kernel: [0.25, 0.5, 0.25]
  loss: {residual: 0.25, huber_delta_bw: 1.0}

physics:                              # RNEA root-wrench loss (exclusive with force_supervision)
  enabled: false
  use_warp: false
  gravity: 9.81
  min_frames: 5
  smoothing_kernel: [0.25, 0.5, 0.25]
  max_cam_jump_m: null
  loss:
    residual: 1.0
    residual_robust: {kind: square, delta_force: 1.0, delta_torque: 0.5}
    residual_force_weight: 1.0
    residual_torque_weight: 1.0
    force_noncontact: 1.0
    noncontact_gate: {kind: soft_l2, p_lo: 0.2, p_hi: 0.5}
    force_at_contact: 0.1
    contact_min_bw: 0.05
    gate_frames: all
    force_smooth: 0.1
    force_l2: 0.01
    torque_l2: 0.01
    torque_smooth: 0.0

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  epochs: 20
  warmup_epochs: 1
  lr_min: 1.0e-5
  grad_clip: 1.0
  head_lr_scale: 0.1                  # lr multiplier for the fine-tuned pose/camera head copies

output:
  dir: ./output
  exp_name: contact
  log_freq: 10
  save_freq: 5
  monitor: test/contact/f1            # *f1|*iou|*r3d -> max; *mae|*err*|*loss|*residual -> min
