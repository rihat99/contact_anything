# --------------------------------------------------------------------------
# Base config — full documented defaults. Experiment configs set `base:
# configs/base.yaml` and override only what differs. Unknown keys hard-error
# (see contact/config.py). Everything not listed here comes from the
# SAM-3D-Body checkpoint's own model_config.yaml.
# --------------------------------------------------------------------------

base: null

model:
  # SAM-3D-Body base (DINOv3-H backbone + frozen decoder).
  checkpoint_path: /data3/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/model.ckpt
  mhr_model_path:  /data3/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/assets/mhr_model.pt
  init_contact_checkpoint: null       # warm-start common contact weights; fresh optimiser/run
  mask_embed_type: v2                 # pretrained mask conditioning (frozen)
  contact_head:
    contact_keypoint_indices: null    # null = list(range(21)) = body16 + toes/heels.
                                      # Climbing recommendation: add wrists 41/62 + nose 0.
    num_global_tokens: 3
    pool_mode: concat                 # concat | attention | per_token (one output per token)
    dropout: 0.1
    mlp_depth: 4
    mlp_channel_div_factor: 2
    grid_size: 5                      # K x K image-feature grid per keypoint anchor
    grid_radius: 0.1
  temporal:                           # Phase 3: ContactTemporalModule (zero-gated, no-op off)
    enabled: false
    placement: post_decoder           # post_decoder | between_layers | pre_decoder (experimental)
    bottleneck_dim: 256               # lightweight 1024 -> 256 -> 1024 token adapter
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: joint                     # joint (T*K tokens per clip) | per_token (T per token-slot)
    causal: false                     # frame-level causal mask when true
    dropout: 0.0
    position_scale: 1.0               # multiply elapsed seconds before sinusoidal time encoding
  force_head:                         # Step 04: per-extremity 3D force regression (zero-init head)
    enabled: false                    # requires the extremities_4 per_token joint target
    frame: local_world_aligned        # local_world_aligned | local (consumed by the physics loss)
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
  force_temporal:                     # Step 05: temporal attention over force tokens (post_decoder)
    enabled: false                    # requires force_head.enabled; second ContactTemporalModule
    bottleneck_dim: 256               # lightweight 1024 -> 256 -> 1024 token adapter
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # per_token (T per token-slot) | joint (T*K tokens per clip)
    causal: false                     # frame-level causal mask when true
    dropout: 0.0
    position_scale: 1.0               # multiply elapsed seconds before sinusoidal time encoding

contact:
  topology: smpl                      # smpl(6890) | smplx(10475) | mhr -> NotImplementedError
  primary_target: vertex              # headline metric target (monitor/pbar)
  targets:
    vertex:
      enabled: true
      weight: 1.0
      loss: {focal_alpha: 0.75, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.5, sparsity_weight: 0.002}
    joint:
      enabled: false
      joint_set: smplx_body_22
      weight: 1.0
      supervise_subset: null          # null=all 22 | 'observable_14' | index list
      derive_from_vertex: false       # OFF: video 'stable contact' != still 'surface contact'
      use_confidence_weights: false   # weight the joint loss by contact_conf_22
      loss: {focal_alpha: 0.5, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.5, sparsity_weight: 0.0}

data:
  datasets: []                        # list of {name, config[, split]}
  eval_split: val                     # val | test (manual ClimbingVideos annotations)
  val_ratio: 0.15                     # stills: random item split; videos: source-video group split
  seed: 42
  frames_per_batch: 32                # B_clips = frames_per_batch // T (homogeneous-T batches)
  num_workers: 16
  # target_frame: all supervises every temporal row; center supervises only the
  # middle row (and therefore requires an odd frames_per_clip).
  sequence: {frames_per_clip: 8, frame_stride: 2, jitter: true, target_frame: all}

physics:                              # Step 06: RNEA root-wrench physics loss on the forces
  enabled: false                      # requires force_head.enabled + a climbing_videos dataset
  use_warp: false                     # opt into BetterRobot's fused CUDA FK/RNEA lanes
  model_path: null                    # null -> $BETTERHUMAN_MODELS_DIR then sibling BetterHuman
  lod: 1                              # MHR level of detail (1 matches SAM-3D-Body)
  gravity: 9.81                       # magnitude m/s^2; DIRECTION is per scene (gravity_world)
  min_frames: 5                       # clips shorter than this are physics-ineligible
  smoothing_kernel: [0.25, 0.5, 0.25] # manifold smoothing kernel; odd-length, [1.0] = off
  max_cam_jump_m: null                # null = off; else drop clips whose camera-center jump (m) between consecutive SAMPLED clip frames exceeds this
  # All loss weights are dimensionless (residual force / m*g, torques / m*g*1m).
  loss:
    residual: 1.0                     # sum rho(r_f)+rho(r_tau) root-wrench residual (objective)
    residual_robust:                  # per-component residual robustifier; square = original objective
      kind: square                    # square | pseudo_huber
      delta_force: 1.0                # pseudo-Huber transition for the 3 force components (bw)
      delta_torque: 0.5               # pseudo-Huber transition for the 3 torque components (bw*m)
    force_noncontact: 1.0             # (1-p)||f||^2 penalty at non-contact extremities (D8)
    force_at_contact: 0.1             # p*relu(contact_min_bw - ||f||)^2 at contacts (weak)
    contact_min_bw: 0.05              # minimum contact force, in units of body weight
    force_smooth: 0.1                 # ||f_t - f_{t-1}||^2 on world-frame forces
    force_l2: 0.01                    # ||f||^2 magnitude regulariser
    torque_l2: 0.01                   # ||tau_j||^2 joint-torque regulariser (residual frames)
    torque_smooth: 0.0                # ||tau_j(t) - tau_j(t-1)||^2 (needs >=2 residual frames)

loss: {dice_eps: 1.0e-5, grad_clip: 1.0}

train:                               # Phase 4: narrow the autograd graph (grad-asserted no-ops).
  detach_interm_preds: true          # interm MHR/camera preds -> torch.no_grad() + detached
  backbone_no_grad: true             # wrap ONLY the frozen backbone call in torch.no_grad()

optim: {lr: 1.0e-4, weight_decay: 1.0e-4, epochs: 20, warmup_epochs: 1, lr_min: 1.0e-5}

logging:
  # This box is logged into wandb (rihat99/Rikhat) -> default mode "online".
  wandb: {enabled: true, project: contact-anything, entity: null, tags: [], mode: online}
  tensorboard: true
  tensorboard_metrics: null           # null logs every scalar; otherwise exact tag allowlist

output: {dir: ./output, exp_name: contact, log_freq: 10, val_freq: 1, save_freq: 5,
         # best-model selection: '..._f1'/'..._iou' -> max, '.../loss' -> min.
         monitor: val/vertex_f1}
