# Base config: every allowed key with its default. Experiment yamls set
# `base: configs/base.yaml` and override; unknown keys hard-error.
base: null

model:
  checkpoint_path: /home/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/model.ckpt
  mhr_model_path: /home/rikhat.akizhanov/.cache/huggingface/hub/models--facebook--sam-3d-body-dinov3/snapshots/11aaa346c7204874a1cbafe3d39a979080b2c55a/assets/mhr_model.pt
  decoder_bf16: false                 # run the frozen decoder under bf16 autocast (MHR / keypoint readouts stay fp32)
  decoder_checkpointing: false        # recompute the decoder layers in the backward (activation checkpointing)
  contact:                            # learned decoder tokens, one per slot of data.contact_set, + a shared per-token head
    enabled: true
    keypoint_indices: [62, 41, 15, 18, 17, 20]   # kindyn6 only: MHR70 anchors in group order (LH, RH, LF toe, RF toe, LA heel,
                                      # RA heel); under frames35 every token anchors at ITS frame's vertex projected through
                                      # the MHR body (model/contact_frames.py) and this list is ignored
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
    grid_size: 5                      # K x K feature grid sampled around each anchor (1 = a point sample)
    grid_radius: 0.1                  # grid spacing in normalized [-1, 1] sample coordinates
  force:                              # force tokens (same anchors) -> one 3D force per slot, body-weight units, body-root frame
    enabled: false
    keypoint_indices: [62, 41, 15, 18, 17, 20]
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
    grid_size: 5
    grid_radius: 0.1
  cross_modal_temporal:               # THE post-decoder mixing brick: one RoPE transformer over the listed token blocks
    enabled: false                    # across the frames of a clip (within-frame mixing is its dt = 0 diagonal)
    modalities: [pose, contact]       # >= 1 of pose | contact | force; 'pose' writes the token the SMPL-X head reads
    num_layers: 4
    num_heads: 16
    mlp_ratio: 2.0
    dropout: 0.1
    window: 2.5                       # attention half-width in SECONDS (null = the whole clip); receptive field grows by
                                      # `window` per layer, so a T=60 model runs single-pass on whole scenes
    time_scale: 25.0                  # RoPE rotation units per second (25 = one unit per 25-fps frame)
  smplx:                              # from-scratch SMPL-X pose + camera heads on the (mixed) pose token = THE pose output
    enabled: false
    model_path: /home/rikhat.akizhanov/better/BetterHuman/models/smplx/SMPLX_NEUTRAL.npz
    hands: false                      # also regress the 30 finger joints (52-joint body, q 211)
    mlp_depth: 2                      # SAM3D's own head shape: C -> C -> D
    mlp_channel_div_factor: 1
    dropout: 0.0
    camera: cliff                     # cliff (CLIFF crop weak-perspective (s, tx, ty), lifted with the crop side and the focal) |
                                      # ray (pelvis bearing x/z, y/z + log depth about a fixed 3.5 m: the crop box never enters
                                      # the lift; needs the depth / bearing or root anchors below instead of `cam`)
  token_heads:                        # contact / force / gravity heads on the (mixed) pose token itself — the
    enabled: false                    # temporal-model-free readout (no refiner): zero-init FFNs, one per output
    outputs: [contact, force, gravity]   # subset of contact / force / gravity, each needs its supervision section;
                                      # forces in the per-frame body's root frame, gravity = the camera's down axis
                                      # plus a body-frame correction, per frame (no clip pooling: no world model)
  refiner:                            # world-space temporal refiner behind the per-frame model (docs/architecture.md)
    enabled: false
    outputs: [pose, contact, motion, force]   # heads to build (subset of pose / contact / motion / force / gravity, >= 1);
                                      # `contact` / `force` here replace the decoder-level heads; each listed output needs
                                      # its supervision section enabled. Under `iterative` every head reads every layer
                                      # (deep supervision via the sections' layer_weight) and the contact probabilities /
                                      # body-frame gravity of layer k are fed back to layer k + 1
    dim: 512                          # token width of the temporal transformer
    num_layers: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    window: 0.5                       # attention half-width in SECONDS per layer (null = the whole clip); the receptive
                                      # field of the block is num_layers x window on each side
    time_scale: 25.0                  # RoPE rotation units per second
    root_smooth_sec: 0.0              # Gaussian sigma (s) of the WORLD pelvis position AFTER the lift (0 = off). Never in
                                      # camera coordinates: those carry the camera's motion, which the lift then fails to cancel
    pose_smooth_sec: 0.0              # Gaussian sigma (s) of the root-rotation / joint-rotation smoothing of the per-frame
                                      # body (0 = off)
    learn_smoothing: false            # train the widths: one log-sigma for the root position + one per rotation (root and
                                      # the 21 joints), initialised from the two *_smooth_sec values (both must be > 0);
                                      # their optimizer group runs at optim.lr x optim.smoothing_lr_scale
    token:                            # extra frame-independent token channels
      local_rotations: false          # parent-local 6D rotations of the 21 joints
      gravity: false                  # the scene's down vector in the body frame (needs the kindyn gravity: smplx GT)
      raw_minus_mean: false           # root position and root-frame joints minus their 5-frame local mean
      one_sided_velocity: false       # replace the CENTRAL root linear / angular velocity channels by the forward AND
                                      # backward one-sided rates (3 + 3 and 3 + 3): a central difference cancels a
                                      # period-2 wobble exactly, which is the component the jitter metric weighs most
      joint_velocity: false           # forward AND backward one-sided angular rates of the 21 parent-local joint
                                      # rotations (2 x 63): the joints' twin of one_sided_velocity
    iterative: false                  # run the temporal layers ONE AT A TIME: the shared zero-init pose head reads
                                      # every layer, the 6D deltas compose, and after each layer but the last the
                                      # corrected trajectory's own rate features (root-frame joints + the one-sided
                                      # root / joint rates) are projected (zero-init linear) back into the residual
                                      # stream, so layer k + 1 sees the rates of the trajectory as layer k left it
                                      # instead of the raw stage-1 ones (SAM3D's decoder updates its anchored tokens
                                      # with the intermediate keypoint readout the same way). Needs the `pose` output
                                      # and token.one_sided_velocity + token.joint_velocity
    feedback_delta: false             # ... and append the CUMULATIVE correction to that feedback (135 channels): the root
                                      # shift in the input body frame and the composed root + 21 joint rotation deltas as
                                      # 6D. The rates alone are blind to the slow drift the layers already accumulated
                                      # (the world root position itself may never enter — it is not frame-independent).
                                      # `iterative` only
    camera_context: false             # append the camera seen from the body (pelvis->camera direction in the body frame,
                                      # log depth, crop-box bearing and angular size) to the per-frame token
    camera_axes: false                # ... plus the camera's down (+y) and viewing (+z) axes in the body frame (6): the
                                      # camera's tilt relative to the body, the strongest gravity cue that is not the
                                      # corpus gravity (12 deg median on measured scenes). Needs camera_context; the
                                      # `gravity` output's prior is the down axis, so that output needs this
    gravity_input:                    # GIVE the clip the scene's gravity instead of letting it guess: four token
      enabled: false                  # channels (the vector in the body frame + the flag that says it was given),
                                      # and the `gravity` output of a given clip IS that vector — the head's votes
                                      # are dropped there and gravity_supervision skips the clip, so the head is
                                      # never trained to copy its input. Needs the `gravity` output
      p_given: 0.5                    # training: probability that an ELIGIBLE clip is given its gravity (per clip,
                                      # per step; drawn from torch's generator on the batch device)
      measured_only: true             # eligible = the clips whose corpus gravity was MEASURED (as
                                      # gravity_supervision.measured_only): a fallback_down scene's vector is the
                                      # first camera's down axis, not a measurement
      eval_given: true                # eval / inference: every eligible clip is given its gravity (no draws)
    residual_feedback: false          # after every layer but the last, run BetterRobot's RNEA on the layer's body
                                      # (detached) with its gated forces applied (live) under its predicted gravity and
                                      # feed the 6-D root-wrench residual (force in bw, torque about the pelvis in
                                      # bw*m) back into the token stream. Needs iterative + pose, contact, force and
                                      # gravity outputs
    head_grad_scale: 1.0              # factor on the gradient the contact / force / gravity / motion heads (and their
                                      # fed-back values, and the gravity pooling's body rotation) send into the trunk:
                                      # 1 = shared trunk, 0 = the heads are probes of a trunk only the pose losses shape
                                      # (round 8: the shared contact + gravity gradients cost 4 jitter units; a fully
                                      # detached contact probe lost 0.05 F1)
    frame_mask_p: 0.0                 # training-time regularisation: each frame's INPUT token (geometry + projected
                                      # tokens) is replaced by a learned embedding with this probability; the feedback
                                      # channels and the losses are unchanged (GVHMR-style frame masking)
    pose_token: true                  # feed the frozen pose token (projected to pose_token_dim) into the per-frame token
    pose_token_dim: 256
    contact_token_dim: 64             # per-contact-token projection width (the six tokens are concatenated)
    force_frame: body                 # frame the `force` head's three numbers per limb are read in:
                                      # body (the INPUT body frame) | gravity (up = the clip's own gravity
                                      # estimate, heading = the body's +z projected onto the horizontal
                                      # plane, its +y when the body lies along gravity). The GT hand-force
                                      # direction is spread in the root frame (mean resultant length 0.79,
                                      # the trunk leans 43-49 deg) and tight in a gravity-aligned one
                                      # (0.88-0.90). `out["force"]["frame"]` is world-from-this either way,
                                      # so every reader of the forces is unchanged. Needs the `gravity` output
    limb_tokens: false                # SEVEN tokens per frame instead of one: the body token (which then carries no
                                      # contact tokens) plus one token per kindyn group holding that limb's decoder
                                      # contact token and its extremity geometry (root-frame position, one-sided
                                      # body-frame rates, and under camera_context its crop position and log depth
                                      # ratio to the pelvis). The transformer alternates attention along TIME within
                                      # each slot with attention across the seven slots of a frame; the contact and
                                      # force heads read the limb tokens (one logit / one force each) and the limbs
                                      # get their own zero-init feedback path under `iterative`
    force_tokens: false               # six FORCE limb tokens (13 slots with limb_tokens, 7 alone): the force head
                                      # reads the force tokens, the contact head the contact tokens; each limb token
                                      # carries its extremity geometry plus its own decoder token (the force ones the
                                      # model.force block's, which then has no decoder-level head). Needs the force
                                      # output; limb_tokens needs the contact output
    per_frame: false                  # NO information between frames: each frame is refined on its own — the token
                                      # drops the root velocity / dt channels and the limb tokens their rates, the
                                      # attention sees the query frame only (`window` is ignored), the betas and the
                                      # gravity vote are per frame instead of per clip. Needs iterative off, the
                                      # velocity / raw_minus_mean token channels off and no input smoothing

data:
  datasets: [configs/datasets/climbing_videos.yaml]
  epoch_dataset: null                 # with several datasets: the `name` of the one whose clips define an epoch. The
                                      # train loader then alternates micro-batches over the listed datasets in order
                                      # (each from its own video-interleaved stream; the others are cut to that
                                      # dataset's count, a fresh subset every epoch), so every optimizer step of
                                      # accumulate_steps (a multiple of the dataset count) holds equal clip shares.
                                      # Null = one concatenated pool. The test split is always scored per dataset:
                                      # the epoch dataset (else the first listed) under the plain metric tags — the
                                      # monitor's — and every other one under `<name>/`
  contact_set: kindyn6                # kindyn6 | frames35: the slots every contact / force tensor is indexed by
                                      # (model/contact_frames.py) — the six kindyn groups (wrists, big toes, heels; the
                                      # round 5-11 protocol) or the 35 named contact frames of the BetterVideoReconstruction
                                      # body (mesh vertices posed by FK). The loaders emit labels / forces per slot, the
                                      # decoder builds one token per slot, the refiner one limb token per slot; frames35
                                      # predictions are ALSO folded onto the six groups (max / sum over a group's frames)
                                      # for the six-group metrics and the manual test labels
  epoch_fraction: 1.0                 # fraction of the train clips one epoch draws — a different seeded subset per epoch
                                      # (1 = every clip every epoch)
  embedding_cache: false              # corpus loaders emit a cached bf16 backbone embedding (features/embedding, built by
                                      # scripts/data/precompute_embeddings.py) and skip the backbone — on the corpora whose
                                      # dataset yaml declares a cache (`embedding_cache: true`); the others run live
  pose_token_cache: false             # read the cached frozen FINAL pose token instead (features/pose_token, built by the
                                      # GVHMR worktree's scripts/data/precompute_pose_tokens.py) and never run the frozen
                                      # base: no image, mask or embedding is loaded (supersedes embedding_cache). Legal only
                                      # for builds whose decoder carries no learned token block (model.contact / model.force
                                      # off; a pose-only cross_modal block is fine — it reads the cached token)
  frames_per_batch: 240               # per GPU; clips per batch = frames_per_batch // clip.frames
  num_workers: 8
  seed: 42
  clip: {frames: 60, stride: auto, jitter: true}   # stride auto = max(1, round(fps / 25)); jitter = per-epoch window offset
  interleave_videos: false            # deal each epoch's clips out round-robin over the source videos, so one step's
                                      # global batch draws from as many videos as it has clips (else uniform shuffle)
  eval_max_frames: 360                # row cap of the one-clip-per-(scene, person) evaluation protocol

contact_supervision:                  # confidence-weighted BCE on the K contact logits, normalised per slot
  enabled: true
  confidence_weights: true
  weight: 1.0
  class_weights: null                 # per-slot row multipliers {positive: [K], negative: [K]} in contact-set slot order
                                      # (LH, RH, L toe, R toe, L heel, R heel): positive = the false-NEGATIVE penalty,
                                      # negative = the false-POSITIVE penalty (null = uniform BCE)
  layer_weight: 0.0                   # deep supervision (iterative refiner `contact` output): the BCE repeated on the
                                      # intermediate layers' logits (`out["contact"]["logits_layers"]`) as `bce_layer`
                                      # at this weight x `weight`; metrics stay the final layer's

force_supervision:                    # kindyn GT forces (bw units, body-root frame) on in-contact rows
  enabled: false
  confidence: true                    # weight rows by kindyn's per-frame force_confidence
  layer_weight: 0.0                   # deep supervision (iterative refiner `force` output): the per-limb terms
                                      # (force / magnitude / direction / noncontact) repeated on the intermediate
                                      # layers' forces (`out["force"]["forces_layers"]`) as `<term>_layer` at this
                                      # weight x the term's own; metrics stay the final layer's
  confidence_power: 1.0               # ... raised to this exponent (1 = as is, 0.5 = compressed low tail, 0 = flat)
  loss:
    force: 1.0                        # Huber on the force VECTORS of in-contact rows
    magnitude: 0.0                    # Huber on |f_pred| - |f_gt| (bw) of in-contact rows (huber_delta_bw)
    direction: 0.0                    # 1 - cos(f_pred, f_gt) of in-contact rows with |f_gt| >= direction_min_bw
    direction_min_bw: 0.1
    huber_delta_bw: 0.5
    outlier_bw: 4.0                   # drop in-contact rows whose GT magnitude exceeds this
    noncontact: 1.0                   # L1 magnitude on non-contact rows (GT is zero there)
    sum_force: 0.0                    # Huber on the net force over the six groups
    sum_torque: 0.0                   # Huber on the net torque (bw*m lever arms about the pelvis)
    huber_delta_bwm: 0.1
    group_weights: null               # per-slot multipliers of the `force` term (K entries; null = uniform)

smplx_supervision:                    # kindyn SMPL-X GT (camera frame) for model.smplx; metrics in metric_pose/*
  enabled: false                      # (always the FINAL body: the refined one under model.refiner)
  joint_weights: {fingers: 0.1}       # weight of each finger joint in kp2d / kp3d (body joints 1.0)
  kp2d_space: crop                    # crop (SAM3D's crop-normalized [-0.5, 0.5]) | image (full image in bearing units px / f)
  layer_weight: 0.0                   # deep supervision (model.refiner.iterative only, >= 2 layers): the `refined` terms
                                      # are ALSO evaluated on each INTERMEDIATE layer and added as `refined_<term>_layer`
                                      # with this weight x the term's own (mass = rows x layers)
  refined:                            # the terms on the REFINED body (model.refiner only; the `loss` block below always
    kp3d: 0.0                         # scores the PER-FRAME head's own body, which is the final body without a refiner):
    orient: 0.0                       # the same definitions as their `loss` twins, reported as `refined_<term>`
    pose: 0.0
    root_bias: 0.0
    root_shape: 0.0
  loss:                               # the PER-FRAME SMPL-X + camera heads' body
    kp2d: 10.0                        # Huber; crop units (kp2d_space crop) | bearing units (image)
    kp3d: 5.0                         # Huber, pelvis-relative camera metres (22 | 52 joints)
    orient: 1.0                       # MSE on the root 6D
    pose: 1.0                         # MSE on the 21 body-joint 6D
    hand_pose: 0.0                    # MSE on the 30 finger-joint 6D (needs model.smplx.hands)
    betas: 0.1                        # MSE on the 10 betas
    cam: 1.0                          # Huber on the CLIFF (s, tx, ty) proxy (camera cliff only; 0 under ray)
    root_bias: 0.0                    # Huber on the norm of the per-clip MEAN world root error (metres): the absolute anchor
    root_shape: 0.0                   # Huber on the per-frame deviation of the world root error from that clip mean: the
                                      # trajectory shape, quadratic at the wander's scale (a per-frame Huber past its knee
                                      # is blind to it)
    depth: 0.0                        # Huber on the pelvis log depth — the crop-free depth anchor of a ray head
    bearing: 0.0                      # Huber on the pelvis bearing (x/z, y/z)
    huber_delta_2d: 0.05              # crop units (kp2d_space crop) | bearing units (image)
    huber_delta_3d: 0.1
    huber_delta_cam: 0.05
    huber_delta_root_bias: 0.1        # m
    huber_delta_root_shape: 0.02      # m
    huber_delta_depth: 0.05           # log units (5 %)
    huber_delta_bearing: 0.02

motion_supervision:                   # refiner `motion` output vs kindyn world joints / root finite-differenced
  enabled: false                      # (Gaussian label smoothing), every vector expressed in the predicted body frame
  label_smooth_sec: 0.12              # sigma (s) of the GT velocity smoothing (acceleration = smoothed derivative of it)
  stencil: legacy                     # legacy: v* = G(D q), a* = G(D v*) vs raw central differences of the prediction
                                      # (a* is effectively a 0.17 s Gaussian) | aligned: ONE Gaussian on the GT trajectory,
                                      # then the SAME stencils on both sides (central velocity, tight second difference) |
                                      # forward: aligned with the central first differences replaced by one-sided forward
                                      # ones (Nyquist-visible); rows are the stencils' support, with no Gaussian margin
  scale: {vel: 0.3, acc: 1.5, ang_vel: 0.5, ang_acc: 2.5}   # GT RMS per quantity (m/s, m/s^2, rad/s, rad/s^2):
                                      # predictions and targets are divided by these before the Huber
  layer_weight: 0.0                   # deep supervision (model.refiner.iterative only, >= 2 layers): every enabled pose_*
                                      # term is ALSO evaluated on each INTERMEDIATE layer's trajectory and added as
                                      # `<term>_layer` with this weight x the term's own (one term per quantity pooled
                                      # over the layers, mass = rows x layers). Metrics stay the final layer's
  loss:
    vel: 1.0                          # motion-head terms (weights; the Huber delta is in standardized units)
    acc: 1.0
    ang_vel: 1.0
    ang_acc: 1.0
    pose_vel: 0.0                     # pose-derivative matching: raw finite differences of the REFINED world
    pose_acc: 0.0                     # joints / root vs the same smoothed GT targets (gradient -> the pose head);
    pose_ang_vel: 0.0                 # needs a refiner 'pose' output
    pose_ang_acc: 0.0
    pose_vel_rms: 0.0                 # amplitude matching of the refined pose's derivatives: per clip and
    pose_acc_rms: 0.0                 # joint, Huber on RMS(pred) - RMS(GT) in `scale` units. A pointwise
    pose_ang_vel_rms: 0.0             # Huber on a frame-unpredictable target (raw GT acceleration) is
    pose_ang_acc_rms: 0.0             # minimised by SHRINKING; this term has no shrink direction
    pose_ss_vel: 0.0                  # band-limited matching: the refined trajectory AND the GT both
    pose_ss_acc: 0.0                  # smoothed with the 0.12 s eval Gaussian, then the same stencils
    pose_ss_ang_vel: 0.0              # and Huber (the pose_ss_* metrics); asks for the predictable
    pose_ss_ang_acc: 0.0              # band only, so no shrink incentive on the raw trajectory
    huber_delta: 1.0

force_consistency:                    # RNEA root-wrench residual of the REFINED motion under the predicted forces
  enabled: false                      # (22-joint BetterHuman SMPL-X dynamics body, BetterRobot rnea; docs/old/refiner.md)
  smooth_sec: 0.0                     # Gaussian sigma (s) on the refined pose before differentiation (0 = off: the refined
                                      # motion is already smoothed at the refiner's input; 0.12 in the round-2 phase 2)
  detach_pose: false                  # true = gradient to the force head only (the retired physics regime)
  gate_by_contact: true               # multiply the forces by the DETACHED predicted contact probability
  loss:
    force: 1.0                        # pseudo-Huber weight of the force residual (body weights)
    torque: 5.0                       # ... of the torque residual (bw * m): the allocation channel, ~23x weaker
    joint_torque: 0.0                 # weight of the strength-weighted joint-torque term: mean over rows of
                                      # sum_dof w_dof * tau_dof^2 ((bw * m)^2), the 21 body joints' RNEA torques
                                      # on a DETACHED body (only the forces may move to lighten it)
    huber_delta_force: 1.0
    huber_delta_torque: 0.5
  joint_torque_multipliers:           # per joint GROUP (the joint name without side and index) multiplier of the
    hip: 1.0                          # SQUARED torque: the weaker the joint, the dearer its torque, so a load the
    knee: 1.0                         # forces may put on either the arms or the legs lands on the legs (BVR's
    ankle: 1.7                        # [torque.multipliers] table). Every body joint must be covered
    foot: 1.7
    spine: 1.0
    neck: 6.0
    head: 6.0
    collar: 2.5
    shoulder: 2.5
    elbow: 3.3
    wrist: 17.0

contact_consistency:                  # stillness of the REFINED extremities (wrists, toes, heels) while labelled in contact:
  enabled: false                      # L1 on their world speed (m/s) weighted by the contact label; gradient -> pose path
  weight: 1.0
  confidence_weights: true            # weight rows by the label confidence (as contact_supervision)
  stencil: forward                    # speed stencil: forward = |x(t+1) - x(t)| / dt on rows whose next frame is valid
                                      # (sees a period-2 wobble) | central = (x(t+1) - x(t-1)) / 2 dt (blind to it)

gravity_supervision:                  # the refiner's `gravity` output (one unit down vector per clip) vs the corpus gravity
  enabled: false
  weight: 1.0                         # 1 - cos(predicted, corpus) per clip
  measured_only: true                 # supervise only clips whose corpus gravity was MEASURED (geocalib source `ground`
                                      # or `geocalib`); a `fallback_down` scene's gravity is the first camera's down axis,
                                      # not a measurement. Metrics report measured and fallback clips separately either way
  layer_weight: 0.0                   # deep supervision: the same term on the intermediate layers' estimates
                                      # (`out["gravity"]["world_layers"]`) as `cos_layer`

gaussian_reference:                   # annealed pull of the REFINED body toward the Gaussian of the refiner's own
  enabled: false                      # INPUT (the fixed round-4 kernel): a starting basin for a free pose head trained
                                      # with the input smoothing off, withdrawn before the run ends
  root_sigma_sec: 0.10                # Gaussian sigma (s) of the reference WORLD root position
  pose_sigma_sec: 0.08                # ... of the reference world root rotation and parent-local joint rotations
  weight: 1.0                         # weight of all three terms (root position Huber, root angle, joint angles)
  anneal_start: 0.3                   # fraction of the run's optimizer steps: full weight up to here,
  anneal_end: 0.6                     # ... then linearly down to 0 at this fraction, 0 after
  huber_delta_root: 0.02              # m

optim:
  lr: 1.0e-4
  init_from: null                     # checkpoint whose trainable (EMA) weights initialise the run — a fine-tune: fresh
                                      # optimizer, schedule and counters (--resume restores those from its own checkpoint)
  weight_decay: 1.0e-4                # AdamW; never applied to biases / norm weights (ndim <= 1)
  epochs: 20
  accumulate_steps: 1                 # micro-batches (of frames_per_batch per GPU) summed into one optimizer step
  smoothing_lr_scale: 1.0             # lr multiplier of the refiner's learnable smoothing widths (model.refiner.learn_smoothing)
  warmup_steps: 500                   # linear ramp over this many optimizer steps, then per-step cosine to lr_min
  lr_min: 1.0e-5
  grad_clip: 1.0                      # per trainable top-level module (0 = off)
  betas: [0.9, 0.95]                  # AdamW moment decays
  ema: 0.999                          # EMA decay of the trainable weights, used for eval + saved as the
                                      # checkpoint weights (raw weights ride along as ema_raw); 0 = off

output:
  dir: ./output
  exp_name: contact
  log_freq: 10
  save_freq: 5                        # extra epoch_XXXX.pth every N epochs (0 = off); last.pth is rolling
  eval_every: 1                       # evaluate (and update best.pth) every N epochs; the final epoch always evaluates
  monitor: metric_contact/f1          # loss_test/total or metric_<group>/<name>;
                                      # *f1|*iou|*precision|*recall -> max; *err*|*loss|*mpjpe|*pve|*accel|*jitter|*angle*|... -> min
  frozen_metrics: null                # json of frozen-baseline metrics (scripts/eval_frozen_smplx.py)
                                      # drawn as the `frozen` tensorboard run next to the live ones
