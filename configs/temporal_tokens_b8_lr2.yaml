# Best run of the 2026-09-02 round 2 — configs/temporal_tokens.yaml at 4x the clip diversity per
# step AND a square-root-scaled learning rate.
#
# The 2026-09-02 audit measured the gradient noise scale at the trained state as ~16 clips
# (SMPL-X head), ~108 (temporal block) and ~239 (contact head) vs the 2 clips/step of the
# original run (1 clip/GPU x 2 GPUs). This config runs 4 clips/GPU (240 frames, ~30 GiB peak
# with the embedding cache) x 2 GPUs = 8 clips/step, 459 steps/epoch/rank, 5 epochs, per-step
# warm-up (500 steps), lr 2e-4 (sqrt of the 4x batch). At the UNscaled lr 1e-4 the same batch
# LOST on pose at equal epochs (66.2 mm: step-limited); with lr 2e-4 it gave the best result of
# the day in a quarter of the optimizer steps of the 2-clip run:
#   test mpjpe 60.1 / pa 41.2 / pve 77.9 mm, accel 10.5 (frozen 61.1 / 44.1 / 78.1 / 11.9;
#   2-clip run 60.7 / 41.4 / 78.4), contact F1 0.919, P 0.917 / R 0.921, P@R0.9 0.926.
# Retired sibling arms (trashed 2026-09-02): the cost-weighted contact loss (neg_weight 2, heel
# pos_weight 4, transition_tolerance 2) was worse along the whole P/R curve; the optimizer
# hygiene bundle (betas .95, no-decay-1d, EMA, per-group clip) gained 1.5-4 mm on pose at
# lr 1e-4 but cost ~0.005 F1 — untested on top of this config. NOTE: that bundle became the
# base.yaml default on 2026-09-03, so re-running this yaml trains WITH it; the recorded run
# (its config.yaml: betas .999, decay_1d true, ema 0, global clip) did not.
#
# Launch (free 48 GB cards):
#   CUDA_VISIBLE_DEVICES=0,5 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/temporal_tokens_b8_lr2.yaml
base: configs/temporal_tokens.yaml

data:
  frames_per_batch: 240               # 4 clips x 60 frames per GPU

optim:
  lr: 2.0e-4

output:
  exp_name: temporal_tokens_b8_lr2
