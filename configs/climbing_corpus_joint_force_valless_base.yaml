# BASELINE arm of the vel/acc-conditioning experiment — corpus6_jf_valless_base.
#
# This is `climbing_corpus_joint_force_gated.yaml` verbatim, cut to 10 epochs. Its
# only purpose is to be the matched control for
# `climbing_corpus_joint_force_cond.yaml`, whose RESOLVED config differs from this
# one by `model.cond_input` and `output.exp_name` ALONE (test-enforced in
# tests/test_cond_input.py) — same seed, same scenes, same schedule, same monitor,
# one GPU each. The question the pair answers: does feeding the frozen model's own
# smoothed pelvis velocity/acceleration into the contact and force tokens improve
# force estimation?
#
# Contact branch: SIX contact tokens matched 1:1 to the six kindyn force groups
# (joint_set kindyn_6, anchors = the force anchors below), per_token pooling +
# per_token temporal attention, focal 0.60/2.0 x5, confidence weights, T=7 clips,
# trained FROM SCRATCH. Force branch: six force tokens with their own anchors
# [62, 41, 15, 18, 17, 20] (kindyn order LH, RH, LF=toe, RF=toe, LA=heel, RA=heel),
# body-root frame, joint force-temporal attention, Huber delta 0.1 bw, outlier cut
# 4 bw, legs-x2 group weights. The final force is contact-gated
# (f = f_raw * sigmoid(4 * detached contact logit)) and the sum_force/sum_torque
# consistency terms are on at 0.25. See climbing_corpus_joint_force_gated.yaml for
# why each of those is set the way it is.
#
# Val-less (user directive): `eval_split: test` trains on ALL 331 curated train
# scenes and evaluates on the 30 manually annotated test scenes every epoch.
base: configs/base.yaml

model:
  init_contact_checkpoint: null       # train the six-token contact stack from scratch
  contact_head:
    contact_keypoint_indices: [62, 41, 15, 18, 17, 20]   # = the force anchors (1:1 groups)
    num_global_tokens: 0
    pool_mode: per_token
  temporal:
    enabled: true
    placement: post_decoder
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # each group mixes only with itself through time
    causal: false
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets
  force_head:
    enabled: true
    force_keypoint_indices: [62, 41, 15, 18, 17, 20]
    frame: root                       # body-root frame — no extrinsics in this experiment
    contact_gate:
      enabled: true                   # f = f_raw * sigmoid(sharpness * detached contact logit)
      sharpness: 4.0
  force_temporal:
    enabled: true
    attend: joint                     # groups see each other across time (allocation coupling)
    position_scale: 30.0

contact:
  primary_target: joint
  targets:
    vertex: {enabled: false}
    joint:
      enabled: true
      joint_set: kindyn_6             # LH, RH, L/R foot (big-toe), L/R ankle (heel)
      supervise_subset: null
      use_confidence_weights: true    # low-certainty labels have proportionally less influence
      loss: {focal_alpha: 0.60, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.0, sparsity_weight: 0.0}

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_forces.yaml}
  eval_split: test                    # no val: all 331 train scenes train, manual test evaluates
  frames_per_batch: 35                # per GPU -> 5 clips x T=7. Not a lever: the frozen
                                      # backbone is FLOP-saturated (throughput flat 35 -> 210)
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}

force_supervision:
  enabled: true
  target_frame: center                # supervise row T//2 only; the window still informs it
  loss:
    force: 1.0
    huber_delta_bw: 0.1
    outlier_bw: 4.0
    noncontact: 0.0                   # the contact gate does this job now
    sum_force: 0.25                   # net-force consistency — must stay weaker than force
    sum_torque: 0.25                  # net-torque consistency (bw*m lever arms)
    huber_delta_bwm: 0.1
    group_weights: [1.0, 1.0, 2.0, 2.0, 2.0, 2.0]   # [LH, RH, LF, RF, LA, RA]

train:
  compile_backbone: true              # torch.compile the frozen, FLOP-bound backbone

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 10                          # small-scale A/B, not a converged run

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/joint/f1
  - train/force_sup/loss
  - train/force_sup/force
  - train/force_sup/sum_force
  - train/force_sup/sum_torque
  - train/force_sup/mae
  - train/force_sup/noncontact_mag
  - train/force_sup/n_outliers
  - test/loss
  - test/joint/precision
  - test/joint/recall
  - test/joint/f1
  - test/force_sup/mae

output:
  exp_name: corpus6_jf_valless_base
  monitor: test/force_mae             # minimised; mean |pred - gt| on in-contact limb-frames (bw)
