# static_ray recipe with gate_init zero_proj (2026-09-04, docs/temporal_block_2026-09-04.md): the temporal block
# starts with UNIT gates and ZERO output projections (still an exact identity at init), so its projections get a
# first-order gradient from step one instead of waiting for a zero gate to open. Single GPU, 2 clips/step.
# Result (16-scene static test, 30 epochs): jitter 52.4 (min 50.5 at epoch 13) / mpjpe 72.3 / depth_err 100 / F1 0.874
# vs static_ray R1 (zero_gate, 4 clips/step) 56.7 / 65.2 / 116 / 0.852. Best run without explicit smoothing so far.
#   CUDA_VISIBLE_DEVICES=<gpu> python scripts/train.py --config configs/tb_projzero.yaml
base: configs/base.yaml

model:
  cross_modal_temporal:
    enabled: true
    modalities: [pose, contact]
    dropout: 0.1
    gate_init: zero_proj
  smplx: {enabled: true, hands: true, camera: ray, depth_prior: frozen}
  token_inputs:
    bbox: {enabled: true}
    frozen_camera: {enabled: true}
data:
  datasets: [configs/datasets/climbing_videos_static.yaml]
  frames_per_batch: 120           # 2 clips/step on one GPU (the R3 recipe; other users hold 10-18 GB per card)
  eval_max_frames: 120
contact_supervision: {weight: 5.0}
rollout_eval: {enabled: true}
smplx_supervision:
  enabled: true
  kp2d_space: image
  loss:
    hand_pose: 0.5
    cam: 0.0
    pelvis: 0.0
    depth: 10.0
    bearing: 2.0
    depth_vel: 20.0
    depth_acc: 0.5
    bearing_vel: 5.0
    bearing_acc: 0.2
    huber_delta_2d: 0.02
optim: {lr: 0.0002, weight_decay: 0.01, epochs: 30, lr_min: 1.0e-06}
output: {exp_name: tb_projzero, monitor: metric_pose/mpjpe, frozen_metrics: output/frozen_sam3d_smplx_static16.json}
