# Arm C-A (2026-09-03) — the b8_lr2 recipe + the camera's own motion as an INPUT to the pose
# token, and the root BODY twist regressed from that token (route A: no motion token).
#
# Input: the camera twist between the clip's sampled rows (se3-log of the next camera pose in
# the current camera frame / real dt; m/s, rad/s; zero-init MLP 6 -> C -> C ADDED to the pose
# token before the temporal block). Output: a flat head on the mixed pose token -> the pelvis
# body-frame linear + angular velocity (6, standardized; acceleration dropped), supervised by
# the kindyn SMPL-X root twist (BVR stencil, sigma 0.12 s smoothing) — the SMPL-X head's own
# body, so the eval can ROLL the prediction OUT: integrate the twist from the first frame's
# predicted world root and score the world trajectory with GVHMR's WA-MPJPE100 / W-MPJPE100 /
# RTE / jitter (metric_global/rollout_*), next to the same metrics of the per-frame prediction
# lifted with the GT camera of every frame (lifted_*) and the GT's own jitter.
# Standardize table: 864 train scenes / 273,039 rows, winsorized 0.1-99.9 % (SMPL-X root, body
# frame; scratchpad massive/motion_table_smplx.json — the recipe reproduces the recorded
# gravity-view table bit-for-bit). Camera twist on the train clip rows: linear std
# [0.16, 0.11, 0.33] m/s, angular std [0.05, 0.07, 0.03] rad/s.
# Sibling: configs/camera_motiontoken.yaml (route B: a learned motion token).
#
# Launch:
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/camera_posetoken.yaml
base: configs/temporal_tokens_b8_lr2.yaml

model:
  motion:
    enabled: true
    source: pose_token                # flat head on the (temporally mixed) pose token
    terms: [vel, ang_vel]             # 6 outputs: body-frame linear + angular velocity
  token_inputs:
    camera_twist: {enabled: true}     # -> the pose token (no motion tokens in this route)

motion_supervision:
  enabled: true
  linear_frame: body                  # BVR root body twist (v = R^T p_dot), the frame a roll-out integrates
  root_source: smplx                  # the kindyn SMPL-X pelvis + root rotation = the SMPL-X head's body
  loss: {vel: 1.0, acc: 0.0, ang_vel: 0.5, ang_acc: 0.0, huber_delta: 1.0}
  standardize:                        # [pelvis][vel, acc, ang_vel, ang_acc][xyz], SMPL-X root, body frame
    mean:
      - [[-0.01103,  0.04409,  0.02885], [-0.00050, -0.04009, -0.00859],
         [ 0.00499,  0.00094, -0.00187], [ 0.00035,  0.00171,  0.00089]]
    std:
      - [[ 0.26113,  0.34747,  0.28930], [ 0.96997,  1.23198,  1.09867],
         [ 0.43325,  0.60972,  0.38503], [ 1.75947,  2.33880,  1.44859]]

rollout_eval: {enabled: true}

output:
  exp_name: camera_posetoken
