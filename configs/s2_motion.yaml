# Stage-2 A — s2_motion. 1-epoch probe on top of the stage-1 winner
# (s1_posecam_temporal: split-head finetune + pose_temporal + keypoint losses,
# test/pose_mae 0.0714 vs frozen ~0.10): add ONE UNANCHORED pelvis motion token.
#
# New vs stage 1:
#   * motion_head (1 token, anchored: false — NO in-decoder left-hip
#     grid-sample/posemb update; the token is a pure learned query that reads
#     the image + original tokens through the decoder's asymmetric attention)
#   * motion_temporal (post-decoder self-attn over the token across frames —
#     a per-frame head cannot represent a derivative)
#   * frame_attn over {pose, motion} (returns now that a 2nd modality exists)
#   * motion_supervision — kindyn BVR twist targets, 12-dim (angular), sigma
#     0.12 s label smoothing, standardize table recomputed on the regenerated
#     864-scene corpus (2026-08-28, valid & non-outlier rows).
#
# Contrast arm: s2_motion_consistency.yaml (+ motion_consistency v4 recipe).
#
# Launch:
#   CUDA_VISIBLE_DEVICES=<a>,<b> torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/s2_motion.yaml
base: configs/s1_posecam_temporal.yaml

model:
  motion_head:
    enabled: true
    motion_keypoint_indices: [9]      # ONE pelvis slot; with anchored: false the
    anchored: false                   # index only names/counts the slot
  motion_temporal:
    enabled: true                     # base defaults: 1 layer, bottleneck 256, per_token
  frame_attn:
    enabled: true
    modalities: [pose, motion]
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0

motion_supervision:
  enabled: true
  target_frame: all
  joint_names: [pelvis]
  root_convention: twist
  angular: true                       # 12-dim target (+ body angular vel/acc)
  target_smooth_sec: 0.12
  loss:
    vel: 1.0
    acc: 1.0
    ang_vel: 0.5
    ang_acc: 0.5
    huber_delta: 1.0
    outlier_acc_ms2: 50.0
  # Recomputed 2026-08-28 on the regenerated corpus: ALL 864 train scenes
  # (scenes passed explicitly — the loader's internal val carve-out would drop
  # 90), twist targets smoothed 0.12 s, valid & non-outlier rows (273,037;
  # only 2 outlier rows at 50 m/s^2 — the new kindyn is clean), float64.
  # Rows: [[vel], [acc], [ang_vel], [ang_acc]] in root axes.
  standardize:
    mean:
      - [[-0.01134,  0.04309,  0.02939], [-0.00129, -0.04235, -0.00854],
         [ 0.00535,  0.00146, -0.00212], [ 0.00090,  0.00598,  0.00097]]  # pelvis
    std:
      - [[ 0.26714,  0.35332,  0.28909], [ 1.05970,  1.26363,  1.14138],
         [ 0.44982,  0.64082,  0.40094], [ 2.20839,  3.18406,  1.79500]]  # pelvis

output:
  exp_name: s2_motion
  monitor: test/motion_acc_r3d_pelvis # maximised: linear-acc 3D correlation
