# Sum-boosted conditioned force experiment — corpus6_jf_cond_sum1.
#
# `climbing_corpus_joint_force_cond.yaml` (the conditioned A/B arm) with three
# deliberate changes:
#
# 1. `force_supervision.loss.sum_force: 0.25 -> 1.0` (user-directed: make sure the
#    model receives the net-force signal). Realized LOSS values in the 10-ep A/B:
#    force ~0.246 vs sum_force ~0.147 (weight applied; unweighted ~0.59) — by value
#    the sum term looked like a minority stakeholder. Pre-launch caveat, measured on
#    the A/B checkpoint: by GRADIENT it was already dominant at 0.25 (||g|| ~6.8 of
#    ~7.4 total; the per-ROW mass normalizer gives the sum term ~5x the per-row
#    gradient of the per-limb-frame force term), and at 1.0 the sum:force gradient
#    ratio is ~18:1 — the per-group allocation term becomes a small minority of the
#    update direction. Deliberately accepted: the monitor (test/force_mae) is
#    weight-free, and the question is whether the vel/acc conditioning lets a
#    dominant Newton-sum signal teach DYNAMIC net forces (the unconditioned model
#    predicted a near-constant sum ~1.2 bw). Expect train/grad_norm_raw ~27 (A/B:
#    ~7.6) and a ~4x higher sum_force curve — train-loss curves are NOT comparable
#    to the A/B pair; test/force_mae and test/joint/f1 are. sum_torque stays 0.25.
# 2. `model.cond_input.encoder_hidden: 64` — the vel/acc conditioning enters
#    through a small MLP (Linear(10,64)+GELU+zero-init Linear(64,1024)) per token
#    block instead of a bare zero-init linear, giving the feature path a
#    nonlinearity (e.g. validity-bit gating). Still an exact no-op at init.
# 3. 20 epochs on TWO GPUs (torchrun nproc 2; `frames_per_batch` is per GPU, so
#    the effective batch doubles and steps/epoch halve vs the single-GPU A/B —
#    total optimizer steps match the A/B pair's 10x3054).
#
# Conditioning feature, contact/force branches, data, and all other losses are
# unchanged from the A/B pair — see those headers. Val-less: all 331 train
# scenes train, the 30 manual test scenes evaluate every epoch.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=2,3 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/climbing_corpus_joint_force_cond_sum1.yaml
base: configs/base.yaml

model:
  init_contact_checkpoint: null       # train the six-token contact stack from scratch
  contact_head:
    contact_keypoint_indices: [62, 41, 15, 18, 17, 20]   # = the force anchors (1:1 groups)
    num_global_tokens: 0
    pool_mode: per_token
  temporal:
    enabled: true
    placement: post_decoder
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # each group mixes only with itself through time
    causal: false
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets
  force_head:
    enabled: true
    force_keypoint_indices: [62, 41, 15, 18, 17, 20]
    frame: root                       # body-root frame — no extrinsics in this experiment
    contact_gate:
      enabled: true                   # f = f_raw * sigmoid(sharpness * detached contact logit)
      sharpness: 4.0
  force_temporal:
    enabled: true
    attend: joint                     # groups see each other across time (allocation coupling)
    position_scale: 30.0
  cond_input:
    enabled: true
    features_path: output/motion_probe_geom/cond_features.npz
    encoder_hidden: 64                # small MLP encoder (see header); zero-init output layer
    clip: 5.0                         # 1.1% of vel and 1.0% of acc train rows have a component
                                      # outside +-5 sigma (smoothing leaves |a| up to 183 m/s^2)
    # Measured over the 333 corpus-TRAIN entries (331 scenes) of the artifact,
    # feat_valid frames only: 107,293 of 107,966. Root axes, float64, m/s and
    # m/s^2. Pinned as literals so the conditioning is reproducible from a stored
    # checkpoint config. Reference: the 30 test entries (8,221 valid frames) sit at
    # vel std [0.259, 0.333, 0.300] and acc std [1.078, 1.234, 1.302] — the train
    # set is the wider distribution, so standardized test inputs are under-scaled
    # rather than clipped.
    standardize:
      vel_mean: [-0.01661,  0.04618,  0.03666]
      vel_std:  [ 0.37997,  0.38611,  0.40752]
      acc_mean: [ 0.01234,  0.07964,  0.06722]
      acc_std:  [ 1.86567,  1.57512,  1.78664]

contact:
  primary_target: joint
  targets:
    vertex: {enabled: false}
    joint:
      enabled: true
      joint_set: kindyn_6             # LH, RH, L/R foot (big-toe), L/R ankle (heel)
      supervise_subset: null
      use_confidence_weights: true    # low-certainty labels have proportionally less influence
      loss: {focal_alpha: 0.60, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.0, sparsity_weight: 0.0}

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_forces.yaml}
  eval_split: test                    # no val: all 331 train scenes train, manual test evaluates
  frames_per_batch: 35                # per GPU -> 5 clips x T=7. Not a lever: the frozen
                                      # backbone is FLOP-saturated (throughput flat 35 -> 210)
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}

force_supervision:
  enabled: true
  target_frame: center                # supervise row T//2 only; the window still informs it
  loss:
    force: 1.0
    huber_delta_bw: 0.1
    outlier_bw: 4.0
    noncontact: 0.0                   # the contact gate does this job now
    sum_force: 1.0                    # BOOSTED from 0.25 — net-force consistency is now the
                                      # largest realized term (see header)
    sum_torque: 0.25                  # net-torque consistency (bw*m lever arms)
    huber_delta_bwm: 0.1
    group_weights: [1.0, 1.0, 2.0, 2.0, 2.0, 2.0]   # [LH, RH, LF, RF, LA, RA]

train:
  compile_backbone: true              # torch.compile the frozen, FLOP-bound backbone

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 20

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/joint/f1
  - train/force_sup/loss
  - train/force_sup/force
  - train/force_sup/sum_force
  - train/force_sup/sum_torque
  - train/force_sup/mae
  - train/force_sup/noncontact_mag
  - train/force_sup/n_outliers
  - test/loss
  - test/joint/precision
  - test/joint/recall
  - test/joint/f1
  - test/force_sup/mae

output:
  exp_name: corpus6_jf_cond_sum1
  monitor: test/force_mae             # minimised; mean |pred - gt| on in-contact limb-frames (bw)
