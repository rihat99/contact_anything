# Regime (a) force run #3 — t7mid. Successor to climbing_videos_force_warmstart_t16
# (epoch-2 PASS on the affine input-dependence test but free limbs still ~0.2 bw up).
# Four deliberate changes vs t16, in causal order of the remaining collapse pressure:
#   1. TORQUE residual weighted 20x the force residual. The force part of the root
#      wrench only pins the force SUM (the constant ~1 bw-up solution); the per-limb
#      ALLOCATION signal lives in the torque part, measured ~23x smaller (median
#      0.033 vs 0.74). The raw physical residual (monitor) stays UNWEIGHTED.
#   2. force_noncontact 2.0 -> 10.0: the airborne-limb penalty was not strong enough
#      (free limbs held ~0.2 bw at epoch 2).
#   3. T=7 / stride 1 / Gaussian smoothing: residual frames {2+r..T-3-r} = {3} —
#      the physics residual is computed for exactly the CENTRAL frame of each clip
#      (at stride 1 every source frame is the center of some window). The gated
#      force terms follow the residual frames (gate_frames: residual).
#   4. Contact comes from the t5mid CENTER-FRAME temporal checkpoint (test joint F1
#      0.9096 center@T=5, the best contact model on paper), frozen, seeing exactly
#      its native geometry: a centered 5-frame attention window inside the 7-frame
#      clip (model.temporal.window_frames) with window-relative time encoding.
#      t5mid genuinely uses context and collapses off its window (0.70 at T=16/s2)
#      — the window is what makes it safe to reuse here.
base: configs/climbing_videos_force_warmstart.yaml

model:
  init_contact_checkpoint: output/climb4_t5mid_20260717_140624/best.pth
  # Contact temporal block — must byte-match the t5mid source architecture
  # (configs/climbing_videos_joint_temporal_center.yaml) or the warm start
  # hard-fails. window_frames is NOT part of the arch signature (an attention-
  # window choice, like frames_per_clip).
  temporal:
    enabled: true
    placement: post_decoder
    bottleneck_dim: 256
    num_layers: 1
    num_heads: 4
    mlp_ratio: 2.0
    attend: per_token                 # t5mid: each limb mixes only with itself through time
    causal: false
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets
    window_frames: 5                  # central-5 window inside the T=7 clip (t5mid native T)
  # Force tokens attend the FULL 7-frame clip, and — unlike contact — jointly
  # across the four limbs: forces trade off against each other (the torque
  # balance couples them), so per-limb-only mixing withholds exactly the
  # cross-limb context the allocation problem needs.
  force_temporal:
    enabled: true
    attend: joint                     # limbs see each other across time
    position_scale: 30.0

data:
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  # Stride 1 keeps dt = 1/30 s (finite-difference noise is higher than t16's
  # stride 2; the pseudo-Huber tail + Gaussian smoothing + jerk filter carry the
  # robustness instead). target_frame: center scores/loses contact on the center
  # frame only — the one frame whose windowed t5mid prediction is in-distribution.
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}

physics:
  max_cam_jump_m: 0.5                 # drop clips with reconstruction camera jumps
  # 3-tap Gaussian (sigma = 1 frame), replacing the binomial [0.25, 0.5, 0.25].
  # Radius stays 1 — any wider kernel would leave T=7 with zero residual frames.
  # Root motion is smoothed too: translation+pose linearly, root quaternion by
  # hemisphere-aligned slerp (contact/physics/loss.py::_smooth_configuration).
  smoothing_kernel: [0.27406862, 0.45186276, 0.27406862]
  loss:
    residual: 1.0
    residual_robust: {kind: pseudo_huber, delta_force: 1.0, delta_torque: 0.5}
    residual_force_weight: 1.0        # force part: sum-pinning, already dominant
    residual_torque_weight: 20.0      # torque part: the allocation signal, ~23x weaker — lift it to parity
    gate_frames: residual             # gate force terms on the residual (=center) frame only
    force_noncontact: 10.0            # 2.0 -> 10.0: much stronger airborne-force penalty
    force_at_contact: 0.0             # zero-init head has zero gradient at f=0; keep off
    force_smooth: 0.02
    force_l2: 0.001
    torque_l2: 0.001
    torque_smooth: 0.0

loss:
  grad_clip: 5.0                      # raw-norm telemetry stays on (train/grad_norm_raw)

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 30

logging:
  # Curated tensorboard set (wandb still receives every scalar). The full dump
  # (~70 series: per-extremity P/R/F1/F2, term masses, epoch timers) made TB
  # unnavigable; this is the decision-relevant core.
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/physics/loss
  - train/physics/raw_residual
  - train/physics/residual
  - train/physics/residual_force
  - train/physics/residual_torque
  - train/physics/residual_sat_frac
  - train/physics/force_noncontact
  - train/physics/force_smooth
  - train/physics/force_std
  - train/physics/n_eligible_clips
  - train/physics/n_jerk_excluded_clips
  - test/loss
  - test/joint/f1
  - test/physics/residual

output:
  exp_name: climb4_force_t7mid
  monitor: test/physics_residual      # minimised; RAW unweighted residual — but note
  # the protocol changed again (T=7/s1, Gaussian kernel, 1 residual frame at dt=1/30):
  # numbers are NOT comparable to the t16 run's 0.271-constant baseline without
  # re-scoring baselines under THIS protocol (evaluate.py --warm-start does that).
