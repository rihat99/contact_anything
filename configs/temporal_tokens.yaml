# Temporal probe B — six learned CONTACT TOKENS, per-token head.
#
# Six keypoint-anchored contact tokens (kindyn_6 anchors) ride in the frozen decoder
# behind the asymmetric mask (the pose token never sees them there). ONE 4-layer RoPE
# temporal transformer (cross_modal_temporal over pose + contact, K = 7 tokens/frame)
# mixes all seven across the clip's 60 frames; the per-token contact head reads the six
# mixed contact tokens, the from-scratch SMPL-X head reads the mixed pose token.
# Sibling: configs/temporal_posetoken.yaml (contact straight from the pose token).
#
# Launch (both GPUs, DDP):
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/temporal_tokens.yaml
base: configs/base.yaml

model:
  contact:
    enabled: true
    source: tokens                    # six anchored tokens, one shared per-token classifier
  smplx: {enabled: true}
  cross_modal_temporal:
    enabled: true
    modalities: [pose, contact]       # K = 7 tokens per frame
    num_layers: 4
    num_heads: 16                     # head_dim 64
    mlp_ratio: 2.0
    dropout: 0.1
    time_scale: 25.0
    max_rel_sec: 2.5

data:
  frames_per_batch: 60                # 1 clip x 60 frames per GPU (shared 48 GB cards, ~19 GB free)
  clip: {frames: 60, stride: auto, jitter: true}
  eval_max_frames: 120                # ~11 GiB no-grad peak; the frozen json uses the same cap

contact_supervision:
  enabled: true
  criterion: bce
  weight: 5.0                         # EQUAL gradient pressure on the shared temporal block: at weight 1
                                      # ||g_contact||/||g_smplx|| = 0.20 (per-batch 0.07-0.74) after 300 warm-up
                                      # steps (scratchpad temporal/grad_balance.py, 16 batches); the
                                      # SMPL-X side is ~85% kp2d+kp3d
smplx_supervision: {enabled: true}

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 5
  warmup_steps: 500
  lr_min: 1.0e-6
  grad_clip: 1.0

output:
  exp_name: temporal_tokens
  monitor: metric_pose/mpjpe
  frozen_metrics: output/frozen_sam3d_smplx.json
