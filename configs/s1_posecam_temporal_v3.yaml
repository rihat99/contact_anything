# Stage-1 A v3 — v2 rebuilt after the camera collapse: vel-LED temporal weights
# at measured gradient parity + the v4-proven trust-region rails.
#
# v2 post-mortem (s1_posecam_temporal_v2_20260828_124657): both new mechanisms
# worked (shape rail held shape_dev at 0.04 vs 1.12 unrailed; world acc err
# 27.7 -> 8.5 m/s^2) but the camera drifted metres in depth (train depth_err
# 0.13 -> 3.4 m median, kp2d 4.4 -> 21 px) while test/pose_mae (rotations-only)
# posted 0.0810 as "best". Two compounding causes:
#   1. GRADIENT IMBALANCE — the acc stencil's 1/dt^2 Jacobian gives kp_acc(1.0)
#      a raw grad norm of ~10,082 at init vs 12-117 for every other term
#      (measured: kp2d(1.0)=12 kp3d(0.5)=22 kp3d_abs(0.25)=47 pose(1.0)=117
#      kp_vel(1.0)=187); under loss.grad_clip=1.0 the absolute anchors lost
#      their voice ~100x.
#   2. NULL SPACE — under a (near-)static camera the world vel/acc terms are
#      exactly invariant to any CONSTANT offset of pred_cam_t: they never push
#      the absolute placement, but they cannot restore it either, so with the
#      anchors crowded out the depth random-walked away (weight decay + the
#      unconstrained mean of huge clipped updates).
# Fixes here:
#   * kp_vel 0.3 leads (grad ~56, on par with kp3d_abs ~47) — the velocity
#     stencil (Jacobian 1/2dt ~ 15) is far better conditioned than acc and
#     suppresses jitter indirectly (3 cm jitter = ~0.9 m/s vel error);
#     kp_acc 0.002 (grad ~20) stays as a mild explicit smoothness prior.
#   * cam_rail / rot_rail 10.0 on pred_cam_t / global_rot vs the FROZEN
#     model's own stashed outputs (margins 0.5 m / 0.2 rad): exactly zero for
#     a healthy model, makes the null-space direction explicitly uphill no
#     matter how the term gradients evolve (motion_consistency v4 recipe).
# Eval now reports test/keypoint/* (kp2d/kp3d/depth/vel/acc errors + rail
# deviations), so camera health can never again hide behind pose_mae.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=4,6 torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/s1_posecam_temporal_v3.yaml
base: configs/s1_posecam_temporal_v2.yaml

keypoint_supervision:
  loss:
    kp_vel: 0.3
    kp_acc: 0.002
    cam_rail: 10.0
    rot_rail: 10.0

output:
  exp_name: s1_posecam_temporal_v3
