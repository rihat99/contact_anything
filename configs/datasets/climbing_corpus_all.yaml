name: climbing_corpus

# climbing_corpus with BOTH kindyn GT signals: forces (supervised 6-group loss)
# and motion (pelvis twist vel/acc). Pose pseudo-GT (mhr_1.npz) loading is
# switched on by pose_supervision.enabled in the experiment config, not here.
# See climbing_corpus.yaml for the layout description.
data:
  root: /data3/rikhat.akizhanov/better/data/ClimbingVideos
  contact_level: 1
  load_forces: true       # kindyn_1.npz -> force_gt / force_contact / force_valid per frame
  load_motion: true       # kindyn_1.npz -> motion_gt / motion_valid / motion_rot per frame
