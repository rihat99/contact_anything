# RETIRED 2026-09-06: written for the camera-coordinate depth smoothing (`depth_smooth_sec`) and the
# per-frame `pelvis` anchor, both removed with round 3 (configs/stage2_v3.yaml) — this yaml no longer
# validates; the run's own output/<run>/config.yaml is the record of what it trained with.
# Stage 2, round 2, phase 2: the round-2 refiner warm-started from its 50-epoch run and trained
# 50 more epochs with the RNEA force-consistency loss (docs/refiner.md "Round 2"): the refined
# motion, the predicted contacts and the predicted forces must balance at the free-flyer root.
base: configs/stage2_v2.yaml
model: {warm_start: output/stage2_v2_20260905_234616/last.pth}   # last, not best: best.pth is the epoch-4 MPJPE minimum (55.86 vs 56.06)
                                      # with immature contact / motion / force heads and jitter 25.2 vs 20.5
force_consistency:
  enabled: true
  loss: {force: 5.0, torque: 25.0}    # at 1 / 5 the two terms were ~1.7 % of the total loss on the smoke batch
                                      # (residual 0.48 bw / 0.095 bw*m vs the GT floor 0.27 / 0.071); x5 puts them
                                      # on the motion terms' footing
optim: {lr: 0.0001, epochs: 50, warmup_steps: 50}
output: {exp_name: stage2_v2_force, frozen_metrics: output/stage2_v2_20260905_234616/eval.json}   # the `frozen` TB line = phase 1's final model
