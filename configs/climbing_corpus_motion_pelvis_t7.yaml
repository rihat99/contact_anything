# Motion v3 — corpus_motion_pelvis_t7. ONE motion token regressing the ROOT
# (pelvis) linear velocity + acceleration, against BVR's own target convention.
#
# Why v3: motion tokens v2 (seven slots, `configs/climbing_corpus_motion_t7.yaml`,
# 30 epochs) missed its bar — pelvis acc world-vertical r 0.228 vs the v1
# Gaussian-smoothing baseline 0.501. The suspicion moved from the optimiser to the
# TARGETS, so this run changes two things and nothing else:
#
#   1. The root target is now BVR-EXACT. BetterVideoReconstruction — which
#      produced the kindyn fit these labels come from — derives v/a in exactly one
#      place (tools/smplx_robot/dynamics.py::velocity_acceleration_from_trajectory):
#          d[t] = se3_log(T_t^-1 T_t+1)   (BetterRobot's free-flyer `difference`)
#          v[t] = (d[t-1] + d[t]) / (2 dt),  a[t] = (d[t] - d[t-1]) / dt^2
#      taking the LINEAR part of the free-flyer tangent. That is a body twist, not
#      `R^T` of the world central difference: the two differ by the Coriolis term
#      omega x v (median 6.9% of |a|, up to 26%). v1/v2 supervised the latter.
#      `root_convention: twist` reproduces the producer's own quantity.
#   2. ONE token instead of seven. The six limb slots are 2-3x noisier and have no
#      BVR counterpart at all (BVR's non-root tangents are angular-only), so they
#      only added gradient noise to the quantity the bars are stated on.
#
# and two changes that make the task fps-AGNOSTIC — the audit found the raw
# labels are dominated by a sampling-rate artifact (pelvis |a| RMS 3.4 m/s^2 at
# 24 fps vs 13.3 at 60 fps for the same climbing), which no image-conditioned
# model can or should reproduce:
#
#   3. `target_smooth_sec: 0.12` — the root trajectory is Gaussian-smoothed at a
#      fixed PHYSICAL width (0.12 s, i.e. 0.12*fps samples) before the SE3-log
#      differencing, so the label bandwidth is the same at every frame rate.
#      Measured on the 331 train scenes, pelvis |a| RMS by fps goes from
#      3.31/4.97/5.12/6.81/7.06/8.70/9.95 (24...60 fps, strictly rising) to
#      1.49/2.25/2.47/2.19/2.13/2.25/2.47 — trend gone. Smooth-then-differentiate
#      also matches the recipe the Gaussian-smoothing baseline uses.
#   4. `frame_stride: auto` — per-scene max(1, round(fps/25)), so a T=7 clip is
#      0.20-0.26 s everywhere instead of 0.29 s at 24 fps vs 0.10 s at 60.
#
# Anchor: MHR70 index 9 (LEFT HIP). MHR70 has no pelvis keypoint and the model's
# own pelvis is mean(kp[9], kp[10]); the anchor only chooses where the token
# grid-samples image features (~10 cm off), while the TARGET is the true kindyn
# pelvis joint (52-joint index 0). Angular velocity/acceleration stay unsupervised
# ("angular later").
#
# No validation split: `eval_split: test` trains on ALL 331 curated train scenes
# and evaluates on the 30 manually annotated test scenes each epoch. The epoch-end
# eval uses the stock tiling and `target_frame: all`, so it scores 7,786 supervised
# rows out of 7,910 clip rows (1,130 tiled clips) — a DIFFERENT row set from the
# 7,561 canonical centre rows `scripts/evaluate_motion.py` reports on. Use the
# monitor for run-to-run selection, evaluate_motion.py for the comparison table.
# v2's checkpoint selection used a val
# split whose fps mix (27.5% 60-fps frames) differed from test's (87% 25-fps),
# and target amplitude scales ~4x with fps — so val and test were not the same
# distribution and the monitor tracked the wrong one.
base: configs/base.yaml

model:
  motion_head:
    enabled: true
    motion_keypoint_indices: [9]      # one token: pelvis (left-hip anchor)
  motion_temporal:
    enabled: true
    attend: joint                     # K=1: identical to per_token, kept for continuity
    num_layers: 2                     # one layer + zero-init gate is marginal for a difference
    num_heads: 4
    mlp_ratio: 2.0
    bottleneck_dim: 256
    position_scale: 30.0              # 30-fps seconds -> well-separated frame offsets

contact:
  targets:
    vertex: {enabled: false}
    joint: {enabled: false}           # motion-only: no contact branch at all

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_motion.yaml}
  eval_split: test                    # no val split: train on all 331 scenes
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  # frame_stride auto = per-scene max(1, round(fps/25)): T=7 then spans
  # 0.20-0.26 s at EVERY corpus fps (1 below ~37 fps, 2 at 50/60), instead of
  # 0.29 s at 24 fps against 0.10 s at 60. Same stride in training, the
  # epoch-end test eval and evaluate_motion's centred clips.
  sequence: {frames_per_clip: 7, frame_stride: auto, jitter: true, target_frame: all}

motion_supervision:
  enabled: true
  target_frame: all                   # supervise every clip row (so does the epoch-end
                                      # eval; only evaluate_motion.py scores centres)
  joint_names: [pelvis]               # one slot; must match motion_keypoint_indices
  root_convention: twist              # BVR body twist (see the header)
  target_smooth_sec: 0.12             # fixed-SECONDS label bandwidth (see the header)
  loss:
    vel: 1.0
    acc: 1.0
    huber_delta: 1.0
    outlier_acc_ms2: 50.0             # pelvis frames cut, of 106,621 train-valid:
                                      # 18 here, 355 on the raw twist, 343 on the
                                      # v1/v2 rotated_world target
  # Measured on the 331 curated corpus-TRAIN scenes under THIS target definition
  # (twist, smoothed 0.12 s): target-valid frames minus the per-frame outlier bit
  # (106,603 of 106,621 kept), float64. Row = [[vel_x, vel_y, vel_z],
  # [acc_x, acc_y, acc_z]] in root axes, m/s and m/s^2. Pinned as literals so the
  # loss is reproducible from a stored checkpoint config (a registered buffer
  # would not be serialised). The raw-target std was [4.12, 3.57, 4.40]: 3.3x of
  # the acceleration amplitude was sampling-rate wobble. NOTE the head is
  # zero-init, i.e. it starts by predicting exactly this mean — the `mean_prior`
  # row of `evaluate_motion.py --baselines` is that starting score.
  standardize:
    mean:
      - [[-0.01741,  0.04905,  0.03804], [-0.00093, -0.03626, -0.01106]]  # pelvis
    std:
      - [[ 0.29957,  0.35708,  0.30839], [ 1.24717,  1.34592,  1.23255]]  # pelvis

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 10

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/motion/loss
  - train/motion/vel
  - train/motion/acc
  - train/motion/vel_rmse
  - train/motion/acc_rmse
  - train/motion/n_outliers
  - test/loss
  - test/motion/vel_r3d_pelvis
  - test/motion/acc_r3d_pelvis
  - test/motion/vel_vert_r_pelvis
  - test/motion/acc_vert_r_pelvis
  - test/motion/vel_rmse_pelvis
  - test/motion/acc_rmse_pelvis
  - test/motion/n_rows

output:
  exp_name: corpus_motion_pelvis_t7
  # Maximised: the pelvis acceleration Pearson r pooled over all three target
  # components (r3d), which is what the comparison table is stated on — the
  # world-vertical r is one projection of it and is logged alongside. NOT
  # test/loss: eval is never outlier-filtered, so the loss tracks target noise as
  # much as skill. Monitor names use a single slash (`{split}/motion_<key>`, the
  # val/force_mae convention `_monitor_value` parses); the same number is logged
  # under the `test/motion/<key>` tag above.
  monitor: test/motion_acc_r3d_pelvis
