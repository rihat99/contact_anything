# TEST FIXTURE — a verbatim copy of configs/allmod_rope_t60.yaml, which was retired to the
# trash on 2026-08-30 with every other pre-v3 experiment yaml. Kept here only because
# tests pin its resolved values; the archived original is unchanged.
# All-modality RoPE experiment — allmod_rope_t60 (2026-08-28).
#
# rope_t60 (pose-only RoPE temporal, T=60, embedding cache, split fine-tuned
# pose/camera head copies, v2 mesh-fitted mhr_1 pose GT) EXTENDED with the
# contact + force + motion branches and three consistency losses:
#
#   * Temporal design: ONE 4-block RoPE transformer (cross_modal_temporal) over
#     the CONCATENATION of all four modality token blocks — 1 pose + 6 contact
#     + 6 force + 1 motion = 14 tokens per frame, 840 per T=60 clip. RoPE
#     positions are the frame's real elapsed seconds, identical for every token
#     of a frame, so within-frame pairs attend un-rotated (this subsumes the
#     retired frame_attn) and across-frame pairs see relative time. A learned
#     per-slot embedding carries token identity. Pose is a written modality ->
#     final-readout recompute; per-modality pose_temporal is OFF (subsumed).
#   * Contact head is "just an MLP" now: per_token, no global tokens, the force
#     head's FFN geometry (1024 -> 256 -> 1 per token). kindyn_6 target with
#     NaN-aware confidence weighting.
#   * Forces: supervised kindyn GT (bw, root frame) + force_confidence row
#     weights + the detached-contact gate; per-group Huber weights save legs.
#   * Pose loss uses the FULL MHR parameter set: all 125 local q channels
#     (surface-observed since mhr_1 v2) + the 45 blendshapes vs the fitted GT
#     identity (loss.shape). Scales keep the frozen rail (no GT exported).
#   * motion_consistency: angular rows ON and the head term un-detached
#     (bidirectional) — user call 2026-08-28; rot anchors + rails guard the
#     v3 orientation-constancy collapse. WATCH the first epochs.
#   * contact_consistency (NEW): predicted-contact-gated world-frame velocity
#     of the six extremity keypoints ~ 0 (gate detached).
#   * force_consistency (NEW): linear Newton residual a/g = gravity + net
#     predicted force (bw units, mass cancels), ramped in from epoch 3.
#   * Loss propagates through ALL 60 frames (every target_frame: all).
#
# Launch (after the mhr_1 v2 regeneration completes):
#   CUDA_VISIBLE_DEVICES=<2 free> torchrun --standalone --nproc-per-node=2 \
#     scripts/train.py --config configs/allmod_rope_t60.yaml
base: configs/base.yaml

model:
  init_contact_checkpoint: null       # whole stack from scratch
  contact_head:
    contact_keypoint_indices: [62, 41, 15, 18, 17, 20]   # kindyn_6 anchors (1:1 force groups)
    num_global_tokens: 0
    pool_mode: per_token              # one shared FFN(1024->256->1) per token — "just an MLP"
    mlp_depth: 2
    mlp_channel_div_factor: 4
    dropout: 0.0
  force_head:
    enabled: true
    force_keypoint_indices: [62, 41, 15, 18, 17, 20]
    frame: root                       # body-root frame (matches the supervised GT)
    contact_gate:
      enabled: true                   # f = f_raw * sigmoid(4 * detached contact logit)
      sharpness: 4.0
  motion_head:
    enabled: true
    motion_keypoint_indices: [9]      # one token: pelvis (left-hip anchor)
  cross_modal_temporal:               # THE only mixing brick: ONE RoPE transformer over the
    enabled: true                     # 14 tokens/frame x 60 frames of a clip
    modalities: [pose, contact, force, motion]
    num_layers: 4
    num_heads: 16                     # head_dim 64
    mlp_ratio: 2.0
    dropout: 0.1
    time_scale: 25.0
    max_rel_sec: 2.5

contact:
  primary_target: joint
  targets:
    vertex: {enabled: false}
    joint:
      enabled: true
      joint_set: kindyn_6             # LH, RH, L/R foot (big-toe), L/R ankle (heel)
      weight: 1.0
      supervise_subset: null
      use_confidence_weights: true    # NaN-aware kindyn label confidence
      loss: {focal_alpha: 0.60, focal_gamma: 2.0, focal_weight: 5.0,
             dice_weight: 0.0, sparsity_weight: 0.0}

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_all.yaml}
  eval_split: test                    # all 864 train scenes train; 61 annotated test evaluate
  embedding_cache: true
  frames_per_batch: 240               # per GPU -> 4 clips x T=60 (rope_t60 measured 15.5 GiB;
                                      # the extra 13 tokens/frame + losses add some — smoke-check)
  sequence:
    frames_per_clip: 60
    frame_stride: auto
    jitter: true
    target_frame: all                 # loss through ALL 60 frames (T=60 is even — forced too)
    eval_full_scenes: true
    eval_max_frames: 360

force_supervision:
  enabled: true
  target_frame: all
  gt_frame: root
  units: bw
  confidence: true                    # kindyn per-frame force_confidence row weights
  loss:
    force: 1.0
    huber_delta_bw: 0.1               # v2 lesson: foot-scale errors in the linear regime
    outlier_bw: 4.0
    noncontact: 0.0                   # the contact gate does this job
    sum_force: 1.0                    # net-force consistency vs GT sum
    sum_torque: 0.25                  # net-torque consistency (bw*m levers)
    huber_delta_bwm: 0.1
    group_weights: [1.0, 1.0, 2.0, 2.0, 2.0, 2.0]   # [LH, RH, LF, RF, LA, RA]

motion_supervision:
  enabled: true
  target_frame: all
  joint_names: [pelvis]
  root_convention: twist
  angular: true                       # 12-dim pelvis target
  target_smooth_sec: 0.12
  loss:
    vel: 1.0
    acc: 1.0
    ang_vel: 0.5
    ang_acc: 0.5
    huber_delta: 1.0
    outlier_acc_ms2: 50.0
  # Recomputed 2026-08-28 on the regenerated 864-scene corpus (twist, smoothed
  # 0.12 s, angular; 273,037 rows, float64) — the s2_motion table verbatim.
  standardize:
    mean:
      - [[-0.01134,  0.04309,  0.02939], [-0.00129, -0.04235, -0.00854],
         [ 0.00535,  0.00146, -0.00212], [ 0.00090,  0.00598,  0.00097]]  # pelvis
    std:
      - [[ 0.26714,  0.35332,  0.28909], [ 1.05970,  1.26363,  1.14138],
         [ 0.44982,  0.64082,  0.40094], [ 2.20839,  3.18406,  1.79500]]  # pelvis

pose_supervision:
  enabled: true
  loss:
    pose: 1.0
    acc: 0.0                          # smoothness lives in kp_vel/kp_acc + consistency
    huber_delta: 0.1                  # radians
    shape: 1.0                        # 45 blendshapes vs the mhr_1 v2 GT identity (L2)
    shape_rail: 0.0                   # replaced by the GT term
    scale_rail: 1.0                   # no scale GT exported — frozen rail stays

keypoint_supervision:
  enabled: true                       # base: kp2d 1.0, kp3d 0.5, kp3d_abs 0.25
  loss:
    kp_vel: 0.3
    kp_acc: 0.002
    cam_rail: 10.0
    rot_rail: 10.0

motion_consistency:
  enabled: true
  angular: true                       # angular twist rows ON (user call; v4 had them off)
  detach_head: false                  # bidirectional head term (user call: no stop-gradients)
  loss:                               # /200 recalibration (2026-08-29): at gt 1.0 this block
    gt: 0.005                           # was 91% of the total gradient energy; the rails moved
    head: 0.0025                        # to keypoint_supervision (both modules carried copies
    huber_delta: 1.0                    # -> double weight)
    pos: 0.025
    pos_huber_m: 0.1
    rot: 0.01
    rot_huber_rad: 0.1

contact_consistency:
  enabled: true
  detach_gate: true                   # grad -> pose path only (focal owns the contact probs)
  loss:
    vel: 0.5
    huber_delta_ms: 0.5

force_consistency:
  enabled: true
  ramp: {start_epoch: 3, epochs: 3}   # 0 until ep3, 1/3 -> 2/3 -> full at ep5
  smoothing_kernel: [0.25, 0.5, 0.25]
  loss:
    residual: 0.25
    huber_delta_bw: 1.0

train:
  compile_backbone: false             # backbone never runs (embedding cache)
  finetune_pose_head: true
  finetune_camera_head: true

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 40
  warmup_epochs: 1
  lr_min: 1.0e-6

logging:
  wandb: {enabled: false}
  # Exact-match keep-list: headline metrics only (per-joint/per-group tags out).
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/epoch_time_sec
  - train/skipped_batches
  - train/joint/focal
  - train/joint/precision
  - train/joint/recall
  - train/joint/f1
  - train/force_sup/loss
  - train/force_sup/mae
  - train/force_sup/noncontact_mag
  - train/motion/loss
  - train/motion/vel_rmse
  - train/motion/acc_rmse
  - train/motion/ang_vel_rmse
  - train/motion/ang_acc_rmse
  - train/pose/loss
  - train/pose/mae
  - train/pose/shape
  - train/pose/scale_dev
  - train/keypoint/loss
  - train/keypoint/kp2d_err_crop
  - train/keypoint/kp3d_err_m
  - train/keypoint/depth_err_m
  - train/keypoint/kp_vel_err_ms
  - train/keypoint/kp_acc_err_ms2
  - train/keypoint/cam_dev_m
  - train/keypoint/rot_dev_deg
  - train/consistency/loss
  - train/consistency/vel_rmse
  - train/consistency/acc_rmse
  - train/consistency/pos_err_m
  - train/consistency/rot_err_deg
  - train/contact_cons/loss
  - train/contact_cons/vel_ms
  - train/contact_cons/gate_mean
  - train/force_cons/loss
  - train/force_cons/residual_bw
  - train/force_cons/ramp
  - test/loss
  - test/joint/precision
  - test/joint/recall
  - test/joint/f1
  - test/joint/iou
  - test/force_sup/mae
  - test/motion/vel_r3d_mean
  - test/motion/acc_r3d_mean
  - test/motion/vel_rmse_mean
  - test/motion/acc_rmse_mean
  - test/motion/ang_vel_r3d_mean
  - test/motion/ang_acc_r3d_mean
  - test/motion/ang_vel_rmse_mean
  - test/motion/ang_acc_rmse_mean
  - test/pose/mae
  - test/pose/acc_rms_pred
  - test/pose/acc_rms_gt
  - test/pose/acc_ratio
  - test/keypoint/kp2d_err_crop
  - test/keypoint/kp3d_err_m
  - test/keypoint/depth_err_m
  - test/keypoint/kp_vel_err_ms
  - test/keypoint/kp_acc_err_ms2
  - test/keypoint/cam_dev_m
  - test/keypoint/rot_dev_deg
  - test/consistency/gt
  - test/consistency/head
  - test/consistency/pos
  - test/consistency/rot
  - test/contact_cons/vel_ms
  - test/force_cons/residual_bw

output:
  exp_name: allmod_rope_t60
  monitor: test/pose_mae              # minimised; contact/force health via the TB tags
