# TEST FIXTURE — a copy of configs/old/climbing_corpus_force_supervised.yaml with the retired
# sliding-window temporal / frame-attention sections stripped so it still
# validates under the current schema. The archived original is unchanged.
# Supervised force run #2 — corpus6_force_sup_t7_v2. Kindyn solver forces as labels
# (six groups: L/R hand, L/R foot=big-toe, L/R ankle=heel — the kindyn column order),
# body-weight units, body-root frame (GT world forces rotated by the kindyn root
# quaternion; NO camera extrinsics anywhere in the objective).
#
# Force-ONLY build: both contact targets disabled -> no contact tokens, no contact head.
# The six force tokens carry their own MHR70 anchors (decoupled from contact):
#   [62, 41, 15, 18, 17, 20] = L wrist, R wrist, L big-toe-tip, R big-toe-tip, L heel, R heel
# matching the kindyn group order [LH, RH, LF, RF, LA, RA].
#
# v2 changes after run #1 (corpus6_force_sup_t7) collapsed all four leg groups to exact
# zero output while hands learned (val plateau 0.290 vs 0.267 per-group-constant baseline):
#   huber_delta_bw 0.5 -> 0.1   foot-scale errors (~0.15 bw) now sit in the Huber's linear
#                               regime (slope 1/component) instead of quadratic slope ~0.3,
#                               so in-contact gradients match the noncontact L1's slope.
#   noncontact 1.0 -> 0.2       the zero-force term was trivially satisfied (mean off-contact
#                               |pred| 0.012) yet its slope-1 pull made f=0 the optimum for
#                               the leg groups (contact rate 0.60 vs hands 0.86).
#   group_weights legs x2       hands dominate both contact rate and GT magnitude (mean
#                               in-contact |gt| 0.44/0.48 bw vs 0.22-0.28 for legs); weighted
#                               mean gives the legs proportionally more of the force gradient.
#   eval_split test             no val holdout: train on all 331 curated train scenes,
#                               evaluate on the 30 manual-test scenes (all have kindyn).
#
# Loss (contact/force_supervision.py):
#   force      — smooth-L1 (delta 0.1 bw) on valid IN-contact limb-frames; limb-frames
#                with |gt| > 4 bw are dropped (solver blowups, ~0.1% tail, max 48 bw).
#   noncontact — L1 magnitude on valid NON-contact limb-frames (GT is exactly zero there
#                by construction; L1's constant slope admits exact zeros — t7hinge lesson).
# Gating comes from kindyn's own contact mask (= contacts_2 labels, the mask the forces
# were solved under), NOT predicted probabilities — there is no contact branch at all.
#
# T=7 / stride 1 with center-frame supervision (odd T, row T//2), matching the t7-family
# temporal geometry; force temporal attention attends jointly across limbs (forces trade
# off against each other) over the full window.
base: configs/base.yaml

model:
  extra_token_attention: causal   # pinned 2026-08-27: the repo default flipped to mutual
  force_head:
    enabled: true
    force_keypoint_indices: [62, 41, 15, 18, 17, 20]
    frame: root                       # body-root frame — no extrinsics in this experiment
contact:
  targets:
    vertex: {enabled: false}
    joint: {enabled: false}           # force-only: no contact branch at all

data:
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_forces.yaml}
  eval_split: test                    # no val: all 331 train scenes train, manual test evaluates
  frames_per_batch: 35                # per GPU -> 5 clips x T=7
  sequence: {frames_per_clip: 7, frame_stride: 1, jitter: true, target_frame: center}

force_supervision:
  enabled: true
  target_frame: center                # supervise row T//2 only; the window still informs it
  loss:
    force: 1.0
    huber_delta_bw: 0.1
    outlier_bw: 4.0
    noncontact: 0.2
    group_weights: [1.0, 1.0, 2.0, 2.0, 2.0, 2.0]   # [LH, RH, LF, RF, LA, RA]

optim:
  lr: 1.0e-4
  warmup_epochs: 1
  lr_min: 1.0e-6
  epochs: 30

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/force_sup/loss
  - train/force_sup/force
  - train/force_sup/noncontact
  - train/force_sup/mae
  - train/force_sup/noncontact_mag
  - train/force_sup/n_outliers
  - test/loss
  - test/force_sup/mae

output:
  exp_name: corpus6_force_sup_t7_v2
  monitor: test/force_mae             # minimised; mean |pred - gt| on in-contact limb-frames (bw)
