# TEST FIXTURE — a verbatim copy of configs/rope_t60_mhrsup_temponly.yaml, which was retired to the
# trash on 2026-08-30 with every other pre-v3 experiment yaml. Kept here only because
# tests pin its resolved values; the archived original is unchanged.
# rope_t60_mhrsup_rebal minus the split head copies: pose and camera heads stay
# FROZEN, only the 4-block RoPE pose_temporal trains. Isolates what the temporal
# block alone can do (A/B vs the rebalanced finetune arm, launched together).
base: configs/base.yaml

model:
  init_contact_checkpoint: null       # pure pose build: nothing to warm-start
  pose_temporal:
    enabled: true
    type: rope
    num_layers: 4
    num_heads: 16                     # head_dim 64
    mlp_ratio: 2.0
    dropout: 0.1
    time_scale: 25.0
    max_rel_sec: 2.5

contact:
  targets:
    vertex: {enabled: false}
    joint: {enabled: false}           # no contact branch at all

data:
  num_workers: 8                      # two concurrent runs on this host (host-RAM OOM lesson)
  datasets:
    - {name: climbing_corpus, config: configs/datasets/climbing_corpus_pose.yaml}
  eval_split: test
  embedding_cache: true               # bf16 backbone cache; frame JPEGs never decoded
  frames_per_batch: 240               # per GPU -> 4 clips x T=60 (rope_t60 measured 15.5 GiB;
                                      # the vert/bones/scale terms add little — smoke-check)
  sequence:
    frames_per_clip: 60
    frame_stride: auto
    jitter: true
    target_frame: all
    eval_full_scenes: true
    eval_max_frames: 360

pose_supervision:
  enabled: true
  loss:
    pose: 0.5                         # raised from 0.1 (2026-08-29 rebalance): at 0.1 the
                                      # monitored objective was 0.5% of the gradient
                                      # direction — the RoPE blocks were steered by
                                      # everything except pose_mae
    acc: 0.0                          # smoothness lives in kp_vel/kp_acc
    huber_delta: 0.1                  # radians
    shape: 0.05                       # 45 blendshapes vs mhr_1 GT identity, per-channel mean
    bones: 1.0                        # lbs slots 130..135 vs per-person-median GT
    scale: 1.0                        # 68 per-person scale slots vs subspace-projected GT
    huber_delta_bones: 0.05
    shape_rail: 0.0                   # replaced by the GT terms (validator rejects both)
    scale_rail: 0.0
  fit_err_confidence: false
  fit_err_ref_cm: 2.0

keypoint_supervision:
  enabled: true
  # Weighted MEAN over the 70 MHR70 keypoints; weights are 13x the run-B values
  # so each term keeps its previous magnitude (see allmod_rope_t60_mhrsup).
  loss:
    kp2d: 13.0
    kp3d: 6.5
    kp3d_abs: 0.8                     # rebalanced 2026-08-29 (was 3.25): the abs anchors
                                      # held 77% of the gradient energy, ~all into the
                                      # camera head copy; 0.8 ~= parity with kp3d/vert
    kp_vel: 3.9                       # velocity matching (world frame, real seconds)
    kp_acc: 0.026                     # acceleration matching (mild: 1/dt^2 Jacobian)
    vert: 6.5                         # root-relative vertex subset — body shape
    vert_abs: 0.8                     # absolute vertex subset — body size + depth
                                      # (rebalanced 2026-08-29, was 3.25 — see kp3d_abs)
    cam_rail: 10.0
    rot_rail: 10.0
  joint_weights:
    fingers: 0.1
    face: 1.0
  fit_err_confidence: false
  fit_err_ref_cm: 2.0

loss:
  grad_clip: 300.0                    # was 1.0, which bound on 100% of steps (raw med 75,
                                      # p99 228) — degenerated into per-step normalization

train:
  compile_backbone: false             # backbone never runs (embedding cache)
  finetune_pose_head: false           # HEADS FROZEN — this arm trains ONLY the RoPE
  finetune_camera_head: false         # pose_temporal block (36.2M -> 33.6M trainable)

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 40
  warmup_epochs: 1
  lr_min: 1.0e-6

logging:
  tensorboard_metrics:
  - train/loss
  - train/lr
  - train/grad_norm
  - train/grad_norm_raw
  - train/frames_per_sec
  - train/epoch_time_sec
  - train/skipped_batches
  - train/pose/loss
  - train/pose/mae
  - train/pose/shape
  - train/pose/bones
  - train/pose/scale
  - train/pose/bones_mae
  - train/pose/scale_mae
  - train/keypoint/loss
  - train/keypoint/kp2d_err_crop
  - train/keypoint/kp3d_err_m
  - train/keypoint/depth_err_m
  - train/keypoint/kp_vel_err_ms
  - train/keypoint/kp_acc_err_ms2
  - train/keypoint/vert
  - train/keypoint/vert_abs
  - train/keypoint/vert_err_m
  - train/keypoint/vert_size_ratio
  - train/keypoint/cam_dev_m
  - train/keypoint/rot_dev_deg
  - test/loss
  - test/pose/mae
  - test/pose/acc_rms_pred
  - test/pose/acc_rms_gt
  - test/pose/acc_ratio
  - test/keypoint/kp2d_err_crop
  - test/keypoint/kp3d_err_m
  - test/keypoint/depth_err_m
  - test/keypoint/kp_vel_err_ms
  - test/keypoint/kp_acc_err_ms2
  - test/keypoint/vert_err_m
  - test/keypoint/vert_size_ratio
  - test/keypoint/cam_dev_m
  - test/keypoint/rot_dev_deg

output:
  exp_name: rope_t60_mhrsup_temponly
  monitor: test/pose_mae              # minimised; kept comparable with rope_t60. Honest read:
                                      # test/keypoint/{kp3d_err_m, depth_err_m, vert_err_m,
                                      # vert_size_ratio}
